# Render blueprint for the CPRI API.
#
# Render → New → Blueprint → pick this repository. Render reads this file and
# asks for every value marked `sync: false` (the secrets). Nothing here contains
# a credential.
#
# After the first deploy, set the front end's API address to this service's URL
# (see docs/SETUP-DEPLOY-TEST.md) and add the Pages origin to CORS_ORIGINS.
services:
  - type: web
    name: cpri-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      # The front end runs on a different origin (GitHub Pages), so the session
      # cookie must be SameSite=None; Secure. Render terminates TLS, so Express
      # needs TRUST_PROXY to see the request as secure.
      - key: TRUST_PROXY
        value: '1'
      - key: CORS_ORIGINS
        value: https://ahronalcober99-wq.github.io
      # Asked for at deploy time — never stored in this file.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'false'
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Brevo HTTPS email delivery (Brevo → Senders must verify BREVO_SENDER_EMAIL).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Supabase Storage — where uploaded files live, because this service's
      # local disk is wiped on every restart and deploy. Research submission
      # manuscripts, forms, receipts and ethics clearances go to the PRIVATE
      # bucket named by SUPABASE_BUCKET; event covers and avatars use the PUBLIC
      # one (SUPABASE_EVENT_BUCKET). Create them at https://supabase.com →
      # Storage → New bucket, then set these four. The app still boots and works
      # without them — uploads simply land on the ephemeral disk instead.
      # Full notes: .env.example, section "Supabase Storage".
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: SUPABASE_EVENT_BUCKET
        sync: false

      # Optional: the designated Google Form for the researchers' evaluation of
      # their research adviser. With it set, the submission form offers an
      # "Open the Google Form" button beside the link field; left empty, the
      # button is hidden and students still paste the link they were given.
      - key: ADVISER_EVAL_FORM_URL
        value: ''
