<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPRI | Center for Policy and Research Innovations</title>
  <!--
    GitHub Pages publishes this repository in one of two ways:

      * "Deploy from a branch" (Settings -> Pages) publishes the repository ROOT,
        where this file is the only index.html. The website itself lives one level
        down in public/, so this page forwards to it.
      * "GitHub Actions" publishes ONLY public/ (see .github/workflows/pages.yml),
        so this file is never deployed and public/index.html is the homepage.

    Keeping it here means https://<user>.github.io/CPRI/ opens the real site under
    either setting, instead of the README that Jekyll would otherwise render.
  -->
  <meta http-equiv="refresh" content="0; url=public/index.html">
  <link rel="canonical" href="public/index.html">
  <script>location.replace('public/index.html' + location.search + location.hash);</script>
</head>
<body>
  <p>Opening the <a href="public/index.html">CPRI website</a>&hellip;</p>
</body>
</html>
