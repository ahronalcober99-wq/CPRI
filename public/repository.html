<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Repository | CPRI</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Research Repository</h1>
        <p>The institutional archive of CPRI research outputs.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message"></div>

        <!-- Search & filter -->
        <div class="card" style="margin-bottom:22px;">
          <form id="filter-form">
            <div class="grid grid-3" style="gap:14px;">
              <div class="form-group" style="margin:0;">
                <label for="f-title">Search by title</label>
                <input type="text" id="f-title" name="title" placeholder="Title keyword">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-author">Author</label>
                <input type="text" id="f-author" name="author" placeholder="Author name">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-dept">Department / Program</label>
                <input type="text" id="f-dept" name="department" placeholder="Department">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-year">Year completed</label>
                <input type="text" id="f-year" name="year" placeholder="e.g. 2025">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-keywords">Keywords</label>
                <input type="text" id="f-keywords" name="keywords" placeholder="Keywords">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-category">Category</label>
                <select id="f-category" name="category">
                  <option value="">All</option>
                  <option value="institutional">Institutional Research</option>
                  <option value="faculty">Faculty Research</option>
                  <option value="student_thesis">Student Thesis</option>
                  <option value="capstone">Capstone</option>
                  <option value="feasibility">Feasibility Study</option>
                  <option value="action_research">Action Research</option>
                  <option value="extension">Extension-Related Research</option>
                  <option value="innovation">Innovation Project</option>
                </select>
              </div>
            </div>
            <div style="margin-top:14px;display:flex;gap:10px;">
              <button type="submit" class="btn btn-primary">Search</button>
              <button type="button" class="btn btn-navy" id="clear-btn">Clear</button>
            </div>
          </form>
        </div>

        <!-- Admin: publish submission -->
        <div id="admin-panel" class="card" style="display:none;margin-bottom:22px;background:var(--cpri-bg-2);">
          <h3>CPRI Staff / Admin</h3>
          <p class="form-note">Publish an approved submission to the repository by its ID.</p>
          <form id="publish-form" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
            <div class="form-group" style="margin:0;flex:1;min-width:200px;">
              <label for="p-sub">Submission ID</label>
              <input type="text" id="p-sub" name="submissionId" required>
            </div>
            <div class="form-group" style="margin:0;">
              <label for="p-access">Access level</label>
              <select id="p-access" name="accessLevel">
                <option value="downloadable">Full text downloadable</option>
                <option value="viewable">Full text viewable</option>
                <option value="public_abstract">Public (abstract only)</option>
                <option value="restricted_institutional">Restricted to institutional users</option>
                <option value="restricted_staff">Restricted to CPRI staff</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Publish</button>
          </form>
        </div>

        <div id="records"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script type="module">
    import { repositoryCardHtml, REPOSITORY_EMPTY_STATE } from './assets/js/repository-cards.js';

    const message = document.getElementById('message');
    const recordsEl = document.getElementById('records');
    // Filled from GET /api/auth/me before the first render. The server decides
    // who may actually delete; this only decides whether the button is built.
    let currentUser = null;

    function isAdmin() {
      return currentUser?.role === 'admin' && currentUser?.status === 'active';
    }

    function buildQuery() {
      const fd = new FormData(document.getElementById('filter-form'));
      const p = new URLSearchParams();
      for (const [k, v] of fd.entries()) if (v) p.set(k, v);
      return p.toString();
    }

    async function load() {
      const query = buildQuery();
      let res;
      let data;
      try {
        ({ res, data } = await CPRI.apiFetch('/api/repository' + (query ? '?' + query : '')));
      } catch (error) {
        message.className = 'form-message error';
        message.textContent = error.message || 'Could not load repository records.';
        return;
      }
      if (!res.ok) {
        message.className = 'form-message error';
        message.textContent = data?.error || 'Could not load repository records.';
        return;
      }
      const records = Array.isArray(data?.records) ? data.records : [];
      if (!records.length) {
        recordsEl.innerHTML = REPOSITORY_EMPTY_STATE;
        return;
      }
      recordsEl.innerHTML = records
        .map(r => repositoryCardHtml(r, { isAdmin: isAdmin(), escapeHtml: CPRI.escapeHtml }))
        .join('');
    }

    // ---- Delete (admins only) ----
    // The button only reaches the DOM for admins; DELETE /api/repository/:id
    // re-checks the role on the server, so hiding it is never the protection.
    function restoreDeleteButton(button) {
      button.disabled = false;
      button.removeAttribute('aria-busy');
      button.innerHTML = '<i class="bi bi-trash" aria-hidden="true"></i> Delete';
    }

    function removeCardAfterFade(card) {
      return new Promise(resolve => {
        let timer;
        const finish = () => {
          clearTimeout(timer);
          card.removeEventListener('transitionend', onTransitionEnd);
          card.remove();
          resolve();
        };
        const onTransitionEnd = event => {
          if (event.target === card && event.propertyName === 'opacity') finish();
        };
        card.addEventListener('transitionend', onTransitionEnd);
        timer = setTimeout(finish, 350);
        requestAnimationFrame(() => card.classList.add('is-removing'));
      });
    }

    const DELETE_ERRORS = {
      401: 'Please log in again',
      403: "You don't have permission",
      404: 'Entry no longer exists'
    };

    recordsEl.addEventListener('click', async event => {
      const button = event.target.closest('.repo-delete');
      if (!button || button.disabled) return;
      // The card title is a link; never let a Delete click follow it.
      event.preventDefault();
      event.stopPropagation();

      if (typeof window.confirmDialog !== 'function') {
        CPRI.toast('Delete unavailable', 'The confirmation dialog could not be loaded. Refresh the page and try again.', 'exclamation-triangle');
        return;
      }
      const confirmed = await window.confirmDialog(
        `Delete '${button.dataset.title}'? This can't be undone.`,
        'Delete'
      );
      if (!confirmed) return;

      const card = button.closest('.repo-card');
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      button.innerHTML = '<i class="bi bi-trash" aria-hidden="true"></i> Deleting…';

      try {
        const { res } = await CPRI.apiFetch(
          '/api/repository/' + encodeURIComponent(button.dataset.id),
          { method: 'DELETE' }
        );
        if (!res.ok) {
          restoreDeleteButton(button);
          CPRI.toast('Not deleted', DELETE_ERRORS[res.status] || 'Something went wrong. Try again.', 'exclamation-triangle');
          return;
        }
        if (card) await removeCardAfterFade(card);
        if (!recordsEl.querySelector('.repo-card')) recordsEl.innerHTML = REPOSITORY_EMPTY_STATE;
        CPRI.toast('Repository entry deleted', 'The record and its uploaded file were removed.', 'trash');
      } catch {
        restoreDeleteButton(button);
        CPRI.toast('Not deleted', 'Something went wrong. Try again.', 'exclamation-triangle');
      }
    });

    document.getElementById('filter-form').addEventListener('submit', (e) => { e.preventDefault(); load(); });
    document.getElementById('clear-btn').addEventListener('click', () => {
      document.getElementById('filter-form').reset();
      load();
    });

    document.getElementById('publish-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target).entries());
      const { res, data: out } = await CPRI.apiFetch('/api/repository', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fd)
      });
      if (!res.ok) { message.className = 'form-message error'; message.textContent = out.error; return; }
      message.className = 'form-message success';
      message.textContent = out.message;
      e.target.reset();
      load();
    });

    // Role-aware admin panel, then the first render (so cards are built with
    // the correct role the first time).
    (async () => {
      try {
        const { res: meRes, data } = await CPRI.apiFetch('/api/auth/me');
        if (meRes.ok) currentUser = data?.user || null;
      } catch (error) {
        console.warn('Could not verify repository management access:', error);
      }
      if (currentUser && ['admin', 'cpri_staff'].includes(currentUser.role)) {
        document.getElementById('admin-panel').style.display = 'block';
      }
      await load();
    })();
  </script>
</body>
</html>
