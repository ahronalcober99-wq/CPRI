<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | CPRI Account</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Forgot Password</h1>
        <p>Request a password reset link sent to your email.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:480px;">
        <div class="form-message" id="message"></div>
        <form id="forgot-form" class="card">
          <div class="form-group">
            <label for="email">Account Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;">Send Reset Link</button>
          <p class="form-note" style="margin-top:14px;">
            Remembered it? <a href="login.html">Back to login</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const message = document.getElementById('message');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.className = 'form-message';
      const data = Object.fromEntries(new FormData(form).entries());
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/auth/forgot', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const out = await res.json();
        message.className = 'form-message success';
        message.textContent = out.message || 'If that email exists, a reset link has been sent.';
        form.reset();
      } catch (err) {
        message.className = 'form-message error';
        message.textContent = err.message || 'Request failed.';
      } finally {
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
