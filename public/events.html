<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events & Activities | CPRI</title>
  <link rel="icon" type="image/png" href="/images/cpri-logo.jpg">
  <meta name="description" content="Research conferences, symposiums, trainings, and capability-building activities hosted by CPRI.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Events & Activities</h1>
        <p>Conferences, symposiums, trainings, and capability-building activities.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="event-message" role="status" aria-live="polite"></div>
        <h2 class="section-title">Upcoming Activities</h2>
        <div class="grid grid-3" id="events-upcoming"></div>
      </div>
    </section>

    <section class="section alt">
      <div class="container">
        <h2 class="section-title">Past Events & Documentation</h2>
        <div class="grid grid-3" id="events-past"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="section-title">Event Gallery</h2>
        <p class="section-sub">Photos and documentation from recent CPRI activities.</p>
        <div class="grid grid-4" id="gallery"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/event-image-utils.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (async () => {
      const events = await CPRI.fetchJson('/api/events');
      let isAdmin = false;
      try {
        const meRes = await fetch('/api/auth/me');
        if (meRes.ok) {
          const { user } = await meRes.json();
          isAdmin = user?.role === 'admin' && user.status === 'active';
        }
      } catch (error) {
        console.warn('Could not verify event management access:', error);
      }
      const up = document.getElementById('events-upcoming');
      const past = document.getElementById('events-past');
      const gallery = document.getElementById('gallery');
      const message = document.getElementById('event-message');
      if (!events) {
        up.innerHTML = '<p class="empty-state">Unable to load events at this time.</p>';
        return;
      }
      const now = new Date();
      const upcoming = events.filter(e => new Date(e.date) >= now);
      const pastEvents = events.filter(e => new Date(e.date) < now);

      up.innerHTML = upcoming.length ? upcoming.map(e => eventCard(e)).join('')
        : '<p class="empty-state">No upcoming events scheduled.</p>';
      past.innerHTML = pastEvents.length ? pastEvents.map(e => eventCard(e)).join('')
        : '<p class="empty-state">No past events recorded yet.</p>';

      if (gallery) {
        gallery.innerHTML = events.map(e => `
          <div class="card event-gallery-card" data-event-id="${CPRI.escapeHtml(String(e.id))}" style="padding:0;overflow:hidden;">
            ${isAdmin ? `<button type="button" class="event-gallery-delete" data-id="${CPRI.escapeHtml(String(e.id))}" data-title="${CPRI.escapeHtml(e.title)}" aria-label="Delete '${CPRI.escapeHtml(e.title)}'"><i class="bi bi-trash" aria-hidden="true"></i></button>` : ''}
            <img src="${CPRI.escapeHtml(CPRI.resolveImageUrl(e) || CPRIEventImages.placeholderDataUrl)}" alt="${CPRI.escapeHtml(e.title)}" loading="lazy" onerror="this.onerror=null;this.src='${CPRIEventImages.placeholderDataUrl}';this.alt='No image available';" style="display:block;width:100%;height:140px;object-fit:cover;">
            <div style="padding:14px;">
              <h3 style="font-size:1rem;margin:0 0 4px;">${CPRI.escapeHtml(e.title)}</h3>
              <div class="meta">${CPRI.escapeHtml(CPRI.fmtDate(e.date))}</div>
            </div>
          </div>`).join('') || '<p class="empty-state">No photos yet.</p>';
      }

      function eventCard(e) {
        const imageUrl = CPRI.resolveImageUrl(e);
        const placeholder = CPRIEventImages.placeholderDataUrl;
        return `
          <div class="card event-list-card" data-event-id="${CPRI.escapeHtml(String(e.id))}">
            <img src="${CPRI.escapeHtml(imageUrl || placeholder)}" alt="${CPRI.escapeHtml(e.title)}" loading="lazy" onerror="this.onerror=null;this.src='${placeholder}';this.alt='No image available';" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:12px;">
            <span class="badge">${CPRI.escapeHtml(e.type)}</span>
            <h3>${CPRI.escapeHtml(e.title)}</h3>
            <div class="meta">${CPRI.fmtDate(e.date)}</div>
            <p>${CPRI.escapeHtml(e.description)}</p>
            <p style="color:var(--cpri-gray);font-size:.9rem;">📍 ${CPRI.escapeHtml(e.location)}</p>
            ${isAdmin ? `<button type="button" class="btn btn-outline btn-sm delete-event" data-id="${CPRI.escapeHtml(String(e.id))}" style="margin-top:auto;border-color:#b23b32;color:#b23b32;white-space:nowrap;align-self:flex-start;" aria-label="Delete ${CPRI.escapeHtml(e.title)}"><i class="bi bi-x-circle"></i> Delete event</button>` : ''}
          </div>`;
      }

      function showMessage(type, text) {
        message.className = 'form-message ' + type;
        message.textContent = text;
      }

      function removeEventFromLists(eventId) {
        for (const card of document.querySelectorAll('.event-list-card')) {
          if (card.dataset.eventId === eventId) card.remove();
        }
        for (const card of document.querySelectorAll('.event-gallery-card')) {
          if (card.dataset.eventId === eventId) card.remove();
        }
        if (!up.querySelector('.event-list-card')) up.innerHTML = '<p class="empty-state">No upcoming events scheduled.</p>';
        if (!past.querySelector('.event-list-card')) past.innerHTML = '<p class="empty-state">No past events recorded yet.</p>';
        if (gallery && !gallery.querySelector('.event-gallery-card')) gallery.innerHTML = '<p class="empty-state">No photos yet.</p>';
      }

      function fadeRemoveEventCards(eventId) {
        const cards = [...document.querySelectorAll('.event-list-card, .event-gallery-card')]
          .filter(card => card.dataset.eventId === eventId);
        return Promise.all(cards.map(card => new Promise(resolve => {
          let timer;
          const finish = () => {
            clearTimeout(timer);
            card.removeEventListener('transitionend', onTransitionEnd);
            card.remove();
            resolve();
          };
          const onTransitionEnd = event => {
            if (event.target === card && event.propertyName === 'opacity') finish();
          };
          card.addEventListener('transitionend', onTransitionEnd);
          timer = setTimeout(finish, 350);
          requestAnimationFrame(() => card.classList.add('is-removing'));
        }))).then(() => {
          if (!up.querySelector('.event-list-card')) up.innerHTML = '<p class="empty-state">No upcoming events scheduled.</p>';
          if (!past.querySelector('.event-list-card')) past.innerHTML = '<p class="empty-state">No past events recorded yet.</p>';
          if (gallery && !gallery.querySelector('.event-gallery-card')) gallery.innerHTML = '<p class="empty-state">No photos yet.</p>';
        });
      }

      if (gallery && isAdmin) {
        gallery.addEventListener('click', async event => {
          const button = event.target.closest('.event-gallery-delete');
          if (!button) return;
          event.preventDefault();
          event.stopPropagation();
          if (button.disabled) return;

          const ask = window.confirmDialog || ((text) => Promise.resolve(window.confirm(text)));
          if (!await ask(`Delete '${button.dataset.title}'? This also removes its photos and cannot be undone.`, 'Delete')) return;

          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
          try {
            const res = await fetch('/api/events/' + encodeURIComponent(button.dataset.id), {
              method: 'DELETE',
              credentials: 'same-origin'
            });
            const out = await res.json().catch(() => ({}));
            if (!res.ok) {
              button.disabled = false;
              button.removeAttribute('aria-busy');
              CPRI.toast('Delete failed', CPRI.escapeHtml(out.error || 'Could not delete the event.'), 'exclamation-triangle');
              return;
            }
            await fadeRemoveEventCards(button.dataset.id);
            CPRI.toast('Event deleted', CPRI.escapeHtml(out.title || button.dataset.title), 'check-circle-fill');
          } catch {
            button.disabled = false;
            button.removeAttribute('aria-busy');
            CPRI.toast('Delete failed', CPRI.escapeHtml('Could not delete the event. Please try again.'), 'exclamation-triangle');
          }
        });
      }

      document.querySelectorAll('.delete-event').forEach(button => {
        button.addEventListener('click', async () => {
          const ask = window.confirmDialog || ((text) => Promise.resolve(window.confirm(text)));
          if (!await ask('Delete this event? This cannot be undone.', 'Delete')) return;

          button.disabled = true;
          try {
            const res = await fetch('/api/events/' + encodeURIComponent(button.dataset.id), { method: 'DELETE' });
            const out = await res.json();
            if (!res.ok) {
              button.disabled = false;
              showMessage('error', out.error || 'Could not delete the event.');
              return;
            }
            removeEventFromLists(button.dataset.id);
            showMessage(out.warnings?.length ? 'error' : 'success',
              out.warnings?.length ? 'Event deleted, but some uploaded files could not be removed.' : 'Event deleted.');
          } catch {
            button.disabled = false;
            showMessage('error', 'Could not delete the event. Please try again.');
          }
        });
      });
    })();
  </script>
</body>
</html>
