<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Record | CPRI Repository</title>
  <link rel="icon" type="image/png" href="/images/cdsga-logo.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Research Record</h1>
        <p id="rec-title">Loading…</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message"></div>
        <div id="detail" style="display:none;">
          <p><a href="repository.html">&larr; Back to repository</a></p>

          <div class="grid grid-2">
            <div class="card">
              <h3>Details</h3>
              <div class="contact-row"><span class="label">Author(s)</span><span id="d-authors"></span></div>
              <div class="contact-row"><span class="label">Adviser</span><span id="d-adviser"></span></div>
              <div class="contact-row"><span class="label">Department/Program</span><span id="d-dept"></span></div>
              <div class="contact-row"><span class="label">Category</span><span id="d-cat"></span></div>
              <div class="contact-row"><span class="label">Year Completed</span><span id="d-year"></span></div>
              <div class="contact-row"><span class="label">Status</span><span id="d-status"></span></div>
              <div class="contact-row"><span class="label">Access Level</span><span id="d-access"></span></div>
              <div class="contact-row"><span class="label">File</span><span id="d-file"></span></div>
              <div class="form-group" style="margin-top:12px;">
                <label>Abstract</label>
                <p id="d-abstract" style="white-space:pre-wrap;"></p>
              </div>
              <div class="form-group">
                <label>Keywords</label>
                <p id="d-keywords"></p>
              </div>
              <div id="file-action" style="margin-top:10px;"></div>
            </div>

            <div class="card">
              <h3>Citations</h3>
              <div class="form-group">
                <label>APA</label>
                <div class="contact-row" style="display:block;"><span id="c-apa"></span></div>
                <button class="btn btn-navy" data-copy="c-apa" style="margin-top:6px;">Copy APA</button>
              </div>
              <div class="form-group">
                <label>MLA</label>
                <div class="contact-row" style="display:block;"><span id="c-mla"></span></div>
                <button class="btn btn-navy" data-copy="c-mla" style="margin-top:6px;">Copy MLA</button>
              </div>
              <div class="form-group">
                <label>Institutional</label>
                <div class="contact-row" style="display:block;"><span id="c-inst"></span></div>
                <button class="btn btn-navy" data-copy="c-inst" style="margin-top:6px;">Copy Institutional</button>
              </div>
            </div>
          </div>

          <!-- Admin management -->
          <div id="admin-edit" class="card" style="display:none;margin-top:22px;">
            <h3>Manage Record (CPRI Staff / Admin)</h3>
            <div class="form-group">
              <label for="e-access">Access Level</label>
              <select id="e-access">
                <option value="public_abstract">Public (abstract only)</option>
                <option value="viewable">Full text viewable</option>
                <option value="downloadable">Full text downloadable</option>
                <option value="restricted_institutional">Restricted to institutional users</option>
                <option value="restricted_staff">Restricted to CPRI staff</option>
              </select>
            </div>
            <button class="btn btn-primary" id="save-access">Save</button>
            <button class="btn btn-navy" id="delete-rec" style="margin-left:8px;">Delete from Repository</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const message = document.getElementById('message');
    const detail = document.getElementById('detail');
    const id = new URLSearchParams(location.search).get('id');

    function showMsg(type, text){ message.className = 'form-message ' + type; message.textContent = text; }
    function showNotFound() {
      showMsg('error', 'Research record not found. ');
      const back = document.createElement('a');
      back.href = 'repository.html';
      back.textContent = 'Back to repository';
      message.append(back);
    }

    (async () => {
      if (!id) {
        showNotFound();
        return;
      }
      let detailRes;
      let detailData;
      try {
        ({ res: detailRes, data: detailData } = await CPRI.apiFetch('/api/repository/' + encodeURIComponent(id)));
      } catch (error) {
        showMsg('error', error.message || 'Could not load this research record.');
        return;
      }
      if (!detailRes.ok || !detailData?.record) {
        showNotFound();
        return;
      }
      const { record: r, categoryLabel, accessLabel, canDownload } = detailData;
      let currentUser = null;
      let isLoggedOut = false;
      try {
        const { res, data } = await CPRI.apiFetch('/api/auth/me');
        if (res.ok) currentUser = data?.user || null;
        else isLoggedOut = res.status === 401;
      } catch (error) {
        console.error('[repository] could not check current user:', error.message);
      }
      detail.style.display = 'block';
      document.getElementById('rec-title').textContent = r.title;
      document.getElementById('d-authors').textContent = r.authors;
      document.getElementById('d-adviser').textContent = r.adviser || '—';
      document.getElementById('d-dept').textContent = r.department;
      document.getElementById('d-cat').textContent = categoryLabel || r.category;
      document.getElementById('d-year').textContent = r.yearCompleted;
      document.getElementById('d-status').textContent = r.status;
      document.getElementById('d-access').textContent = accessLabel;
      document.getElementById('d-abstract').textContent = r.abstract || '—';
      document.getElementById('d-keywords').textContent = r.keywords || '—';
      document.getElementById('d-file').textContent = r.fileAvailable ? 'Available' : 'Not available';
      document.getElementById('c-apa').textContent = (r.citation && r.citation.apa) || '—';
      document.getElementById('c-mla').textContent = (r.citation && r.citation.mla) || '—';
      document.getElementById('c-inst').textContent = (r.citation && r.citation.institutional) || '—';

      const fa = document.getElementById('file-action');
      const note = document.createElement('p');
      note.className = 'form-note';
      if (!r.fileAvailable) {
        note.textContent = 'No full-text file for this record.';
        fa.append(note);
      } else if (r.accessLevel === 'public_abstract') {
        note.textContent = 'Full text is restricted; only the abstract is public.';
        fa.append(note);
      } else if (canDownload) {
        const label = r.accessLevel === 'viewable' ? 'View Full Text' : 'Download Full Text';
        const button = document.createElement('button');
        button.className = 'btn btn-primary';
        button.type = 'button';
        button.textContent = label;
        button.addEventListener('click', async () => {
          button.disabled = true;
          button.textContent = 'Preparing download...';
          showMsg('', '');
          try {
            const { res, data } = await CPRI.apiFetch(
              '/api/repository/' + encodeURIComponent(String(r.id)) + '/file'
            );
            if (res.status === 401) {
              const next = location.pathname + location.search + location.hash;
              location.href = 'login.html?next=' + encodeURIComponent(next);
              return;
            }
            if (res.status === 404) {
              showMsg('error', data?.message || 'The file is no longer available.');
              return;
            }
            if (res.status === 403) {
              showMsg('error', data?.error || data?.message || 'You do not have access to this file.');
              return;
            }
            if (!res.ok || typeof data?.url !== 'string') {
              throw new Error('Download could not be prepared.');
            }
            location.assign(data.url);
          } catch {
            showMsg('error', 'Couldn’t download the file. Try again.');
          } finally {
            button.disabled = false;
            button.textContent = label;
          }
        });
        fa.append(button);
      } else if (isLoggedOut) {
        const login = document.createElement('a');
        const next = location.pathname + location.search + location.hash;
        login.href = 'login.html?next=' + encodeURIComponent(next);
        login.className = 'btn btn-navy';
        login.textContent = 'Log in to access the full text';
        fa.append(login);
      } else {
        note.textContent = 'Your account does not have access to the full text.';
        fa.append(note);
      }

      // Copy buttons
      document.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = document.getElementById(btn.dataset.copy).textContent;
          navigator.clipboard?.writeText(text);
          showMsg('success', 'Citation copied.');
        });
      });

      // Admin management
      if (currentUser && ['admin', 'cpri_staff'].includes(currentUser.role)) {
        const ae = document.getElementById('admin-edit');
        ae.style.display = 'block';
        document.getElementById('e-access').value = r.accessLevel;
        document.getElementById('save-access').addEventListener('click', async () => {
          try {
            const { res, data: out } = await CPRI.apiFetch('/api/repository/' + encodeURIComponent(String(r.id)), {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ accessLevel: document.getElementById('e-access').value })
            });
            if (!res.ok) return showMsg('error', out?.error || 'Could not update the access level.');
            showMsg('success', 'Access level updated.');
          } catch (error) {
            showMsg('error', error.message || 'Could not update the access level.');
          }
        });
        // Deleting is admin-only (DELETE /api/repository/:id enforces it), so
        // CPRI staff get the access editor but no Delete control at all.
        const deleteBtn = document.getElementById('delete-rec');
        if (currentUser.role === 'admin' && currentUser.status === 'active') {
          deleteBtn.addEventListener('click', async () => {
            const ask = window.confirmDialog || (() => Promise.resolve(false));
            if (!await ask(`Delete '${r.title}'? This can't be undone.`, 'Delete')) return;
            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Deleting…';
            try {
              const { res, data: out } = await CPRI.apiFetch('/api/repository/' + encodeURIComponent(String(r.id)), { method: 'DELETE' });
              if (!res.ok) {
                deleteBtn.disabled = false;
                deleteBtn.textContent = 'Delete from Repository';
                return showMsg('error', out?.error || 'Could not delete this record.');
              }
              location.href = 'repository.html';
            } catch (error) {
              deleteBtn.disabled = false;
              deleteBtn.textContent = 'Delete from Repository';
              showMsg('error', error.message || 'Could not delete this record.');
            }
          });
        } else {
          deleteBtn.remove();
        }
      }
    })();
  </script>
</body>
</html>
