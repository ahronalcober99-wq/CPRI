<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethics Review Archive | CPRI</title>
  <link rel="icon" type="image/png" href="/images/cdsga-logo.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Ethics Review Archive</h1>
        <p>Browse and search ethics review applications and certificates.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message"></div>

        <div id="admin-panel" class="card" style="display:none;margin-bottom:22px;background:var(--cpri-bg-2);">
          <h3>ERB Reviewers / Admin</h3>
          <p class="form-note">Submit a new ethics application on behalf of a researcher.</p>
          <a class="btn btn-primary" href="ethics-form.html" style="display:inline-block;margin-top:8px;">+ New Ethics Application</a>
        </div>

        <div class="card" style="margin-bottom:22px;">
          <form id="filter-form">
            <div class="grid grid-3" style="gap:14px;">
              <div class="form-group" style="margin:0;">
                <label for="f-title">Research title</label>
                <input type="text" id="f-title" name="title" placeholder="Title keyword">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-researchers">Researcher/s</label>
                <input type="text" id="f-researchers" name="researchers" placeholder="Researcher name">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-dept">Department</label>
                <input type="text" id="f-dept" name="department" placeholder="Department">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-status">Status</label>
                <select id="f-status" name="status">
                  <option value="">All</option>
                  <option value="submitted">Submitted</option>
                  <option value="under_review">Under Review</option>
                  <option value="for_revision">For Revision</option>
                  <option value="approved">Approved</option>
                  <option value="exempted_from_full_review">Exempted from Full Review</option>
                  <option value="disapproved">Disapproved</option>
                  <option value="certificate_issued">Certificate Issued</option>
                </select>
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-year">Year</label>
                <input type="text" id="f-year" name="year" placeholder="e.g. 2025">
              </div>
            </div>
            <div style="margin-top:14px;display:flex;gap:10px;">
              <button type="submit" class="btn btn-primary">Search</button>
              <button type="button" class="btn btn-navy" id="clear-btn">Clear</button>
            </div>
          </form>
        </div>

        <div id="records"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const message = document.getElementById('message');
    const recordsEl = document.getElementById('records');

    const STATUS_LABELS = {
      submitted: 'Submitted', under_review: 'Under Review', for_revision: 'For Revision',
      approved: 'Approved', exempted_from_full_review: 'Exempted from Full Review',
      disapproved: 'Disapproved', certificate_issued: 'Certificate Issued'
    };

    function buildQuery() {
      const fd = new FormData(document.getElementById('filter-form'));
      const p = new URLSearchParams();
      for (const [k, v] of fd.entries()) if (v) p.set(k, v);
      return p.toString();
    }

    async function load() {
      const res = await fetch('/api/ethics' + (buildQuery() ? '?' + buildQuery() : ''));
      const { applications } = await res.json();
      if (!applications.length) {
        recordsEl.innerHTML = '<p class="empty-state">No ethics applications found.</p>';
        return;
      }
      recordsEl.innerHTML = applications.map(a => `
        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-start;">
            <div style="flex:1;min-width:240px;">
              <h3 style="margin:0 0 6px;"><a href="ethics-detail.html?id=${a.id}">${escapeHtml(a.title)}</a></h3>
              <div class="meta">${escapeHtml(a.researchers)} · ${escapeHtml(a.department)} · ${a.riskLevel} risk</div>
              <div style="margin-top:8px;"><span class="badge">${a.statusLabel}</span> by ${escapeHtml(a.submitterName || a.researchers)}</div>
              ${a.certificateNumber ? `<div class="form-note" style="margin-top:4px;">Certificate: ${escapeHtml(a.certificateNumber)}</div>` : ''}
            </div>
          </div>
        </div>`).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('filter-form').addEventListener('submit', (e) => { e.preventDefault(); load(); });
    document.getElementById('clear-btn').addEventListener('click', () => {
      document.getElementById('filter-form').reset();
      load();
    });

    (async () => {
      await load();
      const meRes = await fetch('/api/auth/me');
      if (meRes.ok) {
        const { user } = await meRes.json();
        if (['admin', 'cpri_staff', 'ethics_reviewer'].includes(user.role)) {
          document.getElementById('admin-panel').style.display = 'block';
        }
      }
    })();
  </script>
</body>
</html>
