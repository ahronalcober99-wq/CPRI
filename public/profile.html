<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | CPRI</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>User Profile</h1>
        <p>Manage your personal information, photo, and research records.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message"></div>
        <div id="not-logged" class="empty-state" style="display:none;">
          You are not logged in. <a href="login.html">Log in here</a>.
        </div>

        <div id="profile-area" style="display:none;">
          <div class="grid grid-3">
            <!-- Photo + identity -->
            <div class="card" style="grid-column: span 1;">
              <div style="text-align:center;">
                <div id="photo-wrap" role="img" aria-label="Profile avatar" style="width:120px;height:120px;border-radius:50%;background:var(--grad-brand);margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;font-family:var(--font-head);font-weight:800;font-size:2.6rem;color:#fff;box-shadow:0 10px 26px rgba(30,58,138,.3);">
                  <img id="photo" alt="Profile photo" style="width:100%;height:100%;object-fit:cover;display:none;">
                  <span id="photo-initials" style="line-height:1;padding:0 6px;">—</span>
                </div>
                <h3 id="p-name" style="margin:0 0 4px;">—</h3>
                <div class="meta" id="p-role">—</div>
              </div>
              <form id="photo-form" style="margin-top:14px;">
                <input type="file" id="photo-input" name="photo" accept="image/*" style="display:none;">
                <div style="display:flex;gap:8px;">
                  <button type="button" class="btn btn-navy" id="edit-photo-btn" style="flex:1;"><i class="bi bi-camera"></i> Edit Photo</button>
                  <button type="button" class="btn btn-outline" id="remove-photo-btn" style="flex:1;border-color:#b23b32;color:#b23b32;display:none;"><i class="bi bi-trash"></i> Remove</button>
                </div>
              </form>
            </div>

            <!-- Editable details -->
            <div class="card" style="grid-column: span 2;">
              <form id="profile-form">
                <div class="form-group">
                  <label for="fullName">Name</label>
                  <input type="text" id="fullName" name="fullName">
                </div>
                <div class="grid grid-2" style="gap:16px;">
                  <div class="form-group">
                    <label for="department">Department / Program</label>
                    <input type="text" id="department" name="department">
                  </div>
                  <div class="form-group phone-group">
                    <label for="contactNumber">Contact Number</label>
                    <div class="phone-field">
                      <span class="phone-prefix" aria-hidden="true">+63</span>
                      <input type="tel" id="contactNumber" name="contactNumber" inputmode="tel"
                             autocomplete="tel" placeholder="917 123 4567">
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" disabled>
                </div>
                <div class="form-group">
                  <label for="researchInterests">Research Interests</label>
                  <textarea id="researchInterests" name="researchInterests"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </form>
            </div>
          </div>

          <!-- Researches -->
          <div class="card" style="margin-top:22px;">
            <h3>Submitted & Completed Researches</h3>
            <div id="researches"></div>
            <form id="research-form" style="margin-top:16px;border-top:1px solid var(--cpri-border);padding-top:16px;">
              <div class="grid grid-2" style="gap:16px;">
                <div class="form-group">
                  <label for="r-title">Title</label>
                  <input type="text" id="r-title" name="title" required>
                </div>
                <div class="form-group">
                  <label for="r-authors">Authors</label>
                  <input type="text" id="r-authors" name="authors">
                </div>
                <div class="form-group">
                  <label for="r-year">Year</label>
                  <input type="text" id="r-year" name="year">
                </div>
                <div class="form-group">
                  <label for="r-status">Status</label>
                  <select id="r-status" name="status">
                    <option value="submitted">Submitted</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-navy">Add Research</button>
            </form>
          </div>

          <p style="margin-top:18px;"><a href="account.html">Back to account</a></p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script type="module">
    const message = document.getElementById('message');
    const profileArea = document.getElementById('profile-area');
    const notLogged = document.getElementById('not-logged');

    // The field renders a "+63" prefix, so only the national digits are shown.
    // Stored numbers can be E.164 (+639…), local (09…) or 63… — all shown as 9….
    function nationalDigits(value) {
      const raw = String(value ?? '').trim().replace(/[\s().-]/g, '');
      if (/^\+639\d{9}$/.test(raw)) return raw.slice(3);
      if (/^639\d{9}$/.test(raw)) return raw.slice(2);
      if (/^09\d{9}$/.test(raw)) return raw.slice(1);
      if (/^9\d{9}$/.test(raw)) return raw;
      return String(value ?? '').trim();
    }

    // Initials avatar (matches the My Account navbar icon): a gradient circle
    // with the user's initials, replaced by the uploaded photo when one exists.
    function initialsFor(name) {
      if (!name) return '?';
      const parts = String(name).trim().split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }
    function setAvatar(photoUrl, name) {
      const img = document.getElementById('photo');
      const initials = document.getElementById('photo-initials');
      // If a stored photo file is missing on disk, fall back to initials instead
      // of showing a broken-image icon.
      img.onerror = () => { img.style.display = 'none'; initials.textContent = initialsFor(name); initials.style.display = 'block'; };
      if (photoUrl) {
        img.src = photoUrl;
        img.style.display = 'block';
        initials.style.display = 'none';
      } else {
        img.removeAttribute('src');
        img.style.display = 'none';
        initials.textContent = initialsFor(name);
        initials.style.display = 'block';
      }
    }

    function showMsg(type, text) {
      message.className = 'form-message ' + type;
      message.textContent = text;
    }

    (async () => {
      const res = await fetch('/api/auth/profile');
      if (!res.ok) { notLogged.style.display = 'block'; return; }
      const { profile } = await res.json();
      profileArea.style.display = 'block';

      setAvatar(profile.profilePhoto, profile.fullName || profile.username);
      document.getElementById('remove-photo-btn').style.display = profile.profilePhoto ? 'block' : 'none';
      document.getElementById('p-name').textContent = profile.fullName || profile.username;
      document.getElementById('p-role').textContent = profile.roleLabel + ' · ' + profile.status;
      document.getElementById('fullName').value = profile.fullName || '';
      document.getElementById('email').value = profile.email || '';
      document.getElementById('department').value = profile.department || '';
      document.getElementById('contactNumber').value = nationalDigits(profile.contactNumber);
      document.getElementById('researchInterests').value = profile.researchInterests || '';
      renderResearches(profile.researches);
    })();

    function renderResearches(list) {
      const wrap = document.getElementById('researches');
      if (!list || !list.length) {
        wrap.innerHTML = '<p class="form-note">No researches recorded yet.</p>';
        return;
      }
      wrap.innerHTML = `<div class="table-scroll"><table><thead><tr><th>Title</th><th>Authors</th><th>Year</th><th>Status</th><th></th></tr></thead><tbody>` +
        list.map(r => `<tr>
          <td>${r.title}</td>
          <td>${r.authors || '—'}</td>
          <td>${r.year || '—'}</td>
          <td><span class="badge">${r.status}</span></td>
          <td><button class="btn btn-navy" data-del="${r.id}" style="padding:6px 12px;">Remove</button></td>
        </tr>`).join('') + '</tbody></table></div>';
      wrap.querySelectorAll('button[data-del]').forEach(btn => {
        btn.addEventListener('click', () => removeResearch(btn.dataset.del));
      });
    }

    // Save profile details
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch('/api/auth/profile', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      const out = await res.json();
      if (!res.ok) return showMsg('error', out.error || 'Update failed');
      showMsg('success', out.message);
      document.getElementById('p-name').textContent = out.profile.fullName || out.profile.username;
    });

    // Edit photo: open the picker, upload immediately on selection
    document.getElementById('edit-photo-btn').addEventListener('click', () => {
      document.getElementById('photo-input').click();
    });
    document.getElementById('photo-input').addEventListener('change', () => {
      if (document.getElementById('photo-input').files.length) document.getElementById('photo-form').requestSubmit();
    });
    // Upload photo
    document.getElementById('photo-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (!fd.get('photo') || !fd.get('photo').name) return showMsg('error', 'Choose an image first.');
      const res = await fetch('/api/auth/profile/photo', { method: 'POST', body: fd });
      const out = await res.json();
      if (!res.ok) return showMsg('error', out.error || 'Upload failed');
      showMsg('success', out.message);
      setAvatar(out.profilePhoto, document.getElementById('p-name').textContent);
      document.getElementById('remove-photo-btn').style.display = 'block';
    });

    // Remove photo (with in-page confirmation)
    document.getElementById('remove-photo-btn').addEventListener('click', async () => {
      if (!await window.confirmDialog('Remove your profile photo? You can upload a new one anytime.')) return;
      const res = await fetch('/api/auth/profile/photo', { method: 'DELETE' });
      const out = await res.json();
      if (!res.ok) return showMsg('error', out.error || 'Remove failed');
      showMsg('success', out.message);
      setAvatar('', document.getElementById('p-name').textContent);
      document.getElementById('remove-photo-btn').style.display = 'none';
    });

    // Add research
    document.getElementById('research-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch('/api/auth/researches', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      const out = await res.json();
      if (!res.ok) return showMsg('error', out.error || 'Add failed');
      showMsg('success', out.message);
      e.target.reset();
      const me = await (await fetch('/api/auth/profile')).json();
      renderResearches(me.profile.researches);
    });

    async function removeResearch(id) {
      const res = await fetch('/api/auth/researches/' + id, { method: 'DELETE' });
      const out = await res.json();
      if (!res.ok) return showMsg('error', out.error || 'Remove failed');
      showMsg('success', out.message);
      const me = await (await fetch('/api/auth/profile')).json();
      renderResearches(me.profile.researches);
    }

  </script>
</body>
</html>
