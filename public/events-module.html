<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Events and Conferences | CPRI</title>
  <link rel="icon" type="image/png" href="/images/cpri-logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Research Events and Conferences</h1>
        <p>CPRI activities including research galas, seminars, and conferences.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message"></div>

        <!-- Admin: Post event -->
        <div id="admin-panel" class="card" style="display:none;margin-bottom:22px;background:var(--cpri-bg-2);">
          <h3>CPRI Staff / Admin</h3>
          <p class="form-note">Create a new research event, gala, seminar, or conference.</p>
          <button type="button" class="btn btn-primary" id="toggle-create" style="display:inline-block;margin-top:8px;"><i class="bi bi-plus-lg"></i> Create Event</button>

          <form id="create-form" style="display:none;margin-top:18px;">
            <div class="grid grid-2" style="gap:14px;">
              <div class="form-group" style="margin:0;">
                <label for="c-title">Title *</label>
                <input type="text" id="c-title" name="title" required placeholder="e.g. 2026 Research Gala">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="c-theme">Theme *</label>
                <input type="text" id="c-theme" name="theme" required placeholder="e.g. Digital Governance">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="c-datetime">Date and Time *</label>
                <input type="datetime-local" id="c-datetime" name="dateTime" required>
              </div>
              <div class="form-group" style="margin:0;">
                <label for="c-venue">Venue / Platform *</label>
                <input type="text" id="c-venue" name="venue" required placeholder="e.g. CPRI Main Hall or Zoom">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="c-desc">Description</label>
                <textarea id="c-desc" name="description" rows="3" placeholder="What is this event about?"></textarea>
              </div>
              <div class="form-group" style="margin:0;">
                <label for="c-reg">Registration Link</label>
                <input type="url" id="c-reg" name="registrationLink" placeholder="https://…">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="c-photo">Cover Photo</label>
                <div id="c-photo-drop-zone" role="group" aria-label="Event cover image" style="padding:12px;border:1px dashed var(--cpri-border);border-radius:12px;">
                  <input type="file" id="c-photo" name="photo" data-event-image-upload data-event-image-error="c-photo-error" disabled aria-describedby="c-photo-help c-photo-error">
                  <small id="c-photo-help" class="form-note" style="display:block;margin-top:4px;">Optional — shown on the event card and homepage. Max 5 MB. You can also drop one image here.</small>
                  <small id="c-photo-error" data-event-image-error role="alert" style="display:block;color:var(--cpri-danger,#b23b32);"></small>
                  <img id="c-photo-preview" alt="Cover preview" style="display:none;margin-top:10px;max-height:140px;border-radius:12px;border:1px solid var(--cpri-border);">
                  <div id="c-photo-preview-placeholder" role="status" style="display:none;margin-top:10px;padding:16px;border:1px solid var(--cpri-border);border-radius:12px;"></div>
                </div>
              </div>
            </div>
            <div style="margin-top:14px;display:flex;gap:10px;">
              <button type="submit" class="btn btn-primary">Publish Event</button>
              <button type="button" class="btn btn-navy" id="create-cancel">Cancel</button>
            </div>
          </form>
        </div>

        <!-- Search & filter -->
        <div class="card" style="margin-bottom:22px;">
          <form id="filter-form">
            <div class="grid grid-3" style="gap:14px;">
              <div class="form-group" style="margin:0;">
                <label for="f-title">Event title</label>
                <input type="text" id="f-title" name="title" placeholder="Title keyword">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-theme">Theme</label>
                <input type="text" id="f-theme" name="theme" placeholder="Theme keyword">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-venue">Venue / Platform</label>
                <input type="text" id="f-venue" name="venue" placeholder="Venue or platform">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-from">From date</label>
                <input type="date" id="f-from" name="fromDate">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-to">To date</label>
                <input type="date" id="f-to" name="toDate">
              </div>
            </div>
            <div style="margin-top:14px;display:flex;gap:10px;">
              <button type="submit" class="btn btn-primary">Search</button>
              <button type="button" class="btn btn-navy" id="clear-btn">Clear</button>
            </div>
          </form>
        </div>

        <div id="records"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/event-image-upload.js"></script>
  <script src="assets/js/event-image-utils.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const message = document.getElementById('message');
    const recordsEl = document.getElementById('records');
    let isAdmin = false;

    function showMsg(type, text) {
      message.className = 'form-message ' + type;
      message.textContent = text;
      message.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function buildQuery() {
      const fd = new FormData(document.getElementById('filter-form'));
      const p = new URLSearchParams();
      for (const [k, v] of fd.entries()) if (v) p.set(k, v);
      return p.toString();
    }

    async function load() {
      const res = await fetch('/api/events-module' + (buildQuery() ? '?' + buildQuery() : ''));
      const { events } = await res.json();
      if (!events.length) {
        recordsEl.innerHTML = '<p class="empty-state">No events found.</p>';
        return;
      }
      recordsEl.innerHTML = events.map(e => {
        // Content events (Admin Console) have no module detail/registration page.
        const isModule = e.source !== 'content';
        const eventId = String(e.id || '');
        const safeEventId = escapeHtml(eventId);
        const titleHref = isModule ? 'event-detail.html?id=' + encodeURIComponent(eventId) : 'events.html';
        const imageUrl = CPRI.resolveImageUrl(e);
        const imagePlaceholder = CPRIEventImages.placeholderDataUrl;
        return `
        <div class="card event-module-card" data-event-id="${safeEventId}" style="margin-bottom:16px;overflow:hidden;">
          <a href="${escapeHtml(titleHref)}" style="display:block;"><img src="${escapeHtml(imageUrl || imagePlaceholder)}" alt="${escapeHtml(e.title)}" loading="lazy" onerror="this.onerror=null;this.src='${imagePlaceholder}';this.alt='No image available';" style="width:100%;height:200px;object-fit:cover;display:block;"></a>
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:18px;">
            <div style="flex:1;min-width:240px;">
              <h3 style="margin:0 0 6px;"><a href="${escapeHtml(titleHref)}">${escapeHtml(e.title)}</a></h3>
              <div class="meta event-module-meta">
                <span class="event-module-info">${escapeHtml(e.theme || 'Event')} · ${new Date(e.dateTime).toLocaleString()} · ${escapeHtml(e.venue)}</span>
                <span class="event-module-actions">
                  ${isModule ? '' : '<span class="badge" style="font-size:.68rem;">Admin Console</span>'}
                  ${isAdmin ? `<button type="button" class="btn btn-outline-dark btn-sm event-module-delete" data-id="${safeEventId}" data-title="${escapeHtml(e.title)}" aria-label="Delete ${escapeHtml(e.title)}"><i class="bi bi-trash"></i> Delete</button>` : ''}
                </span>
              </div>
              <p style="margin:8px 0;">${escapeHtml(e.description || '')}</p>
              ${e.registrationLink ? `<a class="btn btn-primary" href="${escapeHtml(e.registrationLink)}" target="_blank" rel="noopener noreferrer">Register</a>` : ''}
              ${isModule ? `<a class="btn btn-soft" href="event-detail.html?id=${encodeURIComponent(eventId)}" style="margin-left:8px;">Details</a>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function restoreDeleteButton(button) {
      button.disabled = false;
      button.innerHTML = '<i class="bi bi-trash"></i> Delete';
    }

    function removeCardAfterFade(card) {
      return new Promise(resolve => {
        let timer;
        const finish = () => {
          clearTimeout(timer);
          card.removeEventListener('transitionend', onTransitionEnd);
          card.remove();
          resolve();
        };
        const onTransitionEnd = event => {
          if (event.target === card && event.propertyName === 'opacity') finish();
        };
        card.addEventListener('transitionend', onTransitionEnd);
        timer = setTimeout(finish, 350);
        requestAnimationFrame(() => card.classList.add('is-removing'));
      });
    }

    recordsEl.addEventListener('click', async event => {
      const button = event.target.closest('.event-module-delete');
      if (!button || button.disabled) return;
      const confirmation = `Delete '${button.dataset.title}'? This cannot be undone.`;
      const ask = window.confirmDialog || ((text) => Promise.resolve(window.confirm(text)));
      if (!await ask(confirmation, 'Delete')) return;

      button.disabled = true;
      button.textContent = 'Deleting…';
      try {
        const response = await fetch('/api/events/' + encodeURIComponent(button.dataset.id), {
          method: 'DELETE',
          credentials: 'same-origin'
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          restoreDeleteButton(button);
          CPRI.toast('Delete failed', escapeHtml(result.error || 'Could not delete the event.'), 'exclamation-triangle');
          return;
        }

        const card = button.closest('.event-module-card');
        if (card) await removeCardAfterFade(card);
        if (!recordsEl.querySelector('.event-module-card')) {
          recordsEl.innerHTML = '<p class="empty-state">No events found.</p>';
        }
        CPRI.toast('Event deleted', escapeHtml(result.title || button.dataset.title), 'check-circle-fill');
      } catch {
        restoreDeleteButton(button);
        CPRI.toast('Delete failed', escapeHtml('Could not delete the event. Please try again.'), 'exclamation-triangle');
      }
    });

    document.getElementById('filter-form').addEventListener('submit', (e) => { e.preventDefault(); load(); });
    document.getElementById('clear-btn').addEventListener('click', () => {
      document.getElementById('filter-form').reset();
      load();
    });

    // ---- Create event (admin / CPRI staff) ----
    const createForm = document.getElementById('create-form');
    const toggleCreate = document.getElementById('toggle-create');
    const coverInput = document.getElementById('c-photo');
    const coverDropZone = document.getElementById('c-photo-drop-zone');
    const coverPreview = document.getElementById('c-photo-preview');
    const coverPreviewPlaceholder = document.getElementById('c-photo-preview-placeholder');
    const coverError = document.getElementById('c-photo-error');
    let coverObjectUrl = '';
    let coverValidation = Promise.resolve(true);

    function clearCoverPreview() {
      if (coverObjectUrl) URL.revokeObjectURL(coverObjectUrl);
      coverObjectUrl = '';
      coverPreview.removeAttribute('src');
      coverPreview.style.display = 'none';
      coverPreviewPlaceholder.style.display = 'none';
      coverPreviewPlaceholder.textContent = '';
    }

    async function selectCoverFile(file, isDrop = false) {
      if (!file) {
        clearCoverPreview();
        coverError.textContent = '';
        return true;
      }
      coverValidation = (async () => {
        const ready = await CPRIEventUpload.ready;
        if (!ready) {
          coverError.textContent = 'Image upload options could not be loaded. Refresh this page before choosing a cover image.';
          if (!isDrop) {
            coverInput.value = '';
            clearCoverPreview();
          }
          return false;
        }
        const result = CPRIEventUpload.validate(file);
        if (!result.valid) {
          if (!isDrop) {
            coverInput.value = '';
            clearCoverPreview();
          }
          coverError.textContent = result.message;
          showMsg('error', result.message);
          return false;
        }
        if (isDrop) {
          const transfer = new DataTransfer();
          transfer.items.add(file);
          coverInput.files = transfer.files;
        }
        coverError.textContent = '';
        clearCoverPreview();
        if (CPRIEventUpload.needsPlaceholder(file)) {
          coverPreviewPlaceholder.textContent = 'Preview unavailable for HEIC/HEIF. The selected image will be converted on upload.';
          coverPreviewPlaceholder.style.display = 'block';
        } else {
          coverObjectUrl = URL.createObjectURL(file);
          coverPreview.src = coverObjectUrl;
          coverPreview.style.display = 'block';
        }
        return true;
      })();
      return coverValidation;
    }

    function resetCreateForm() {
      createForm.reset();
      createForm.style.display = 'none';
      toggleCreate.style.display = 'inline-block';
      clearCoverPreview();
      coverError.textContent = '';
      coverValidation = Promise.resolve(true);
    }

    toggleCreate.addEventListener('click', () => {
      const opening = createForm.style.display === 'none';
      createForm.style.display = opening ? 'block' : 'none';
      toggleCreate.style.display = opening ? 'none' : 'inline-block';
      if (opening) {
        message.className = 'form-message';
        message.textContent = '';
        document.getElementById('c-title').focus();
      }
    });
    document.getElementById('create-cancel').addEventListener('click', () => {
      resetCreateForm();
      message.className = 'form-message';
      message.textContent = '';
    });
    coverInput.addEventListener('change', () => {
      selectCoverFile(coverInput.files && coverInput.files[0]);
    });
    coverPreview.addEventListener('error', () => {
      if (!coverObjectUrl) return;
      coverPreview.style.display = 'none';
      coverPreviewPlaceholder.textContent = 'Preview unavailable in this browser. The selected image will be converted on upload.';
      coverPreviewPlaceholder.style.display = 'block';
    });
    coverDropZone.addEventListener('dragover', (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
    });
    coverDropZone.addEventListener('drop', (event) => {
      event.preventDefault();
      const files = event.dataTransfer.files;
      if (!files || files.length !== 1) {
        const error = 'Drop one cover image at a time.';
        coverError.textContent = error;
        showMsg('error', error);
        return;
      }
      selectCoverFile(files[0], true);
    });

    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!await coverValidation) return;
      const fd = new FormData(createForm);
      const res = await fetch('/api/events-module', {
        method: 'POST',
        body: fd
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) return showMsg('error', out.error || 'Could not create event.');
      showMsg('success', 'Event created — it now appears in the list below.');
      resetCreateForm();
      await load();
      // Scroll to the list so the new event is visible right away.
      recordsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    (async () => {
      try {
        const meRes = await fetch('/api/auth/me');
        if (meRes.ok) {
          const { user } = await meRes.json();
          isAdmin = user.role === 'admin' && user.status === 'active';
          if (['admin', 'cpri_staff'].includes(user.role)) {
            document.getElementById('admin-panel').style.display = 'block';
          }
        }
      } catch (error) {
        console.warn('Could not verify event management access:', error);
      }
      await load();
    })();
  </script>
</body>
</html>
