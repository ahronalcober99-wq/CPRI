<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | CPRI</title>
  <link rel="icon" type="image/png" href="/images/cpri-logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <style>
    /* Researcher dashboard: profile card on the left, counts and the research
       table on the right. Colours come from the site's theme tokens, so it
       follows dark mode like every other page. */
    .rd-grid { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 22px; align-items: start; }
    .rd-profile { padding: 26px; }
    .rd-who { display: flex; gap: 18px; align-items: center; margin-bottom: 18px; }
    .rd-avatar { width: 64px; height: 64px; border-radius: 50%; flex: 0 0 64px; display: grid; place-items: center;
      background: var(--cpri-secondary, #6b0000); color: #fff; font-size: 1.8rem; overflow: hidden; }
    .rd-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .rd-name { margin: 0 0 8px; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .01em; }
    .rd-role { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .74rem; font-weight: 600;
      background: var(--maroon-tint, rgba(128,0,0,.10)); color: var(--cpri-text); }
    .rd-row { display: grid; grid-template-columns: 22px 1fr 1.25fr; gap: 12px; align-items: start;
      padding: 13px 0; border-top: 1px solid var(--cpri-border); font-size: .9rem; }
    .rd-row i { color: var(--cpri-muted); font-size: 1.05rem; }
    .rd-row .rd-label { color: var(--cpri-muted); }
    .rd-row .rd-value { color: var(--cpri-text); overflow-wrap: anywhere; }
    .rd-manage { display: flex; justify-content: center; gap: 8px; width: 100%; margin-top: 18px; padding: 13px 16px; }
    .rd-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    /* Scoped by id: a site-wide card rule stacks card contents in a centred
       column, and the stat tiles need icon-left, text-right. */
    #dashboard .rd-stat { display: flex; flex-direction: row; justify-content: flex-start; text-align: left;
      gap: 16px; align-items: center; padding: 20px 24px; margin: 0; }
    .rd-stat .rd-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; flex: 0 0 52px; }
    .rd-stat .rd-ic.submitted { background: var(--maroon-tint, rgba(128,0,0,.10)); color: var(--cpri-secondary, #6b0000); }
    .rd-stat .rd-ic.completed { background: rgba(16,185,129,.14); color: #0b7a56; }
    .rd-stat .rd-k { color: var(--cpri-muted); font-size: .88rem; }
    .rd-stat .rd-v { font-size: 1.6rem; font-weight: 700; font-family: var(--font-head); color: var(--cpri-text); line-height: 1.2; }
    .rd-table-card { padding: 0; overflow: hidden; }
    .rd-tabs { display: flex; gap: 6px; align-items: flex-end; border-bottom: 1px solid var(--cpri-border); padding: 0 20px; flex-wrap: wrap; }
    .rd-tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 16px 14px 12px; cursor: pointer;
      font-weight: 600; font-size: .9rem; color: var(--cpri-muted); display: inline-flex; gap: 8px; align-items: center; }
    .rd-tab.active { color: var(--cpri-secondary, #6b0000); border-bottom-color: var(--cpri-secondary, #6b0000); }
    .rd-tabs .rd-new { margin: 10px 0 10px auto; }
    .rd-table { width: 100%; border-collapse: collapse; }
    .rd-table th { text-align: left; font-size: .8rem; font-weight: 600; color: var(--cpri-muted); padding: 12px 20px;
      background: var(--cpri-bg-2, rgba(0,0,0,.03)); border-bottom: 1px solid var(--cpri-border); }
    .rd-table td { padding: 14px 20px; border-bottom: 1px solid var(--cpri-border); vertical-align: top; font-size: .88rem; color: var(--cpri-text); }
    .rd-title { font-weight: 700; }
    .rd-desc { color: var(--cpri-muted); font-size: .8rem; margin-top: 3px; }
    .rd-status { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; }
    .rd-status.review   { background: rgba(59,130,246,.14); color: #1d4ed8; }
    .rd-status.done     { background: rgba(16,185,129,.16); color: #0b7a56; }
    .rd-status.revision { background: rgba(139,92,246,.16); color: #6d28d9; }
    .rd-status.rejected { background: rgba(185,28,28,.12); color: #b91c1c; }
    .rd-status.muted    { background: rgba(0,0,0,.06); color: var(--cpri-muted); }
    .rd-view { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 8px; font-size: .8rem; font-weight: 600;
      background: var(--cpri-bg-2, rgba(0,0,0,.05)); color: var(--cpri-text); text-decoration: none; white-space: nowrap; }
    .rd-view:hover { filter: brightness(.95); }
    .rd-sub-action { display: block; margin-top: 6px; font-size: .78rem; }
    .rd-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 20px; color: var(--cpri-muted); font-size: .82rem; flex-wrap: wrap; }
    .rd-pages { display: flex; gap: 6px; }
    .rd-empty { padding: 32px 20px; text-align: center; color: var(--cpri-muted); }
    @media (max-width: 900px) {
      .rd-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .rd-stats { grid-template-columns: 1fr; }
      .rd-table thead { display: none; }
      .rd-table, .rd-table tbody, .rd-table tr, .rd-table td { display: block; width: 100%; }
      .rd-table tr { border-bottom: 1px solid var(--cpri-border); padding: 10px 0; }
      .rd-table td { border: 0; padding: 4px 16px; }
      .rd-row { grid-template-columns: 22px 1fr; }
      .rd-row .rd-value { grid-column: 2; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container-xl">
        <h1 id="dash-title">Dashboard</h1>
        <p>Your profile, your research submissions and their status.</p>
      </div>
    </section>

    <section class="section">
      <div class="container-xl">
        <div class="form-message" id="message"></div>

        <div id="not-logged" class="empty-state" style="display:none;">
          Please <a href="login.html">log in</a> to see your account.
        </div>

        <div class="rd-grid" id="dashboard" style="display:none;">
          <!-- Profile -->
          <div class="card rd-profile">
            <div class="rd-who">
              <div class="rd-avatar" id="p-avatar"><i class="bi bi-person"></i></div>
              <div>
                <h2 class="rd-name" id="p-name">—</h2>
                <span class="rd-role" id="p-role">—</span>
              </div>
            </div>
            <div class="rd-row"><i class="bi bi-mortarboard"></i><span class="rd-label">Department / Program</span><span class="rd-value" id="p-dept">—</span></div>
            <div class="rd-row"><i class="bi bi-envelope"></i><span class="rd-label">Email</span><span class="rd-value" id="p-email">—</span></div>
            <div class="rd-row"><i class="bi bi-telephone"></i><span class="rd-label">Contact Number</span><span class="rd-value" id="p-contact">—</span></div>
            <div class="rd-row"><i class="bi bi-lightbulb"></i><span class="rd-label">Research Interests</span><span class="rd-value" id="p-interests">—</span></div>
            <a class="btn btn-primary rd-manage" href="profile.html"><i class="bi bi-pencil-square"></i> Manage Profile</a>
          </div>

          <!-- Counts + research -->
          <div>
            <div class="rd-stats">
              <div class="card rd-stat">
                <span class="rd-ic submitted"><i class="bi bi-file-earmark-text"></i></span>
                <div><div class="rd-k">Submitted Research</div><div class="rd-v" id="stat-submitted">0</div></div>
              </div>
              <div class="card rd-stat">
                <span class="rd-ic completed"><i class="bi bi-check-lg"></i></span>
                <div><div class="rd-k">Completed Research</div><div class="rd-v" id="stat-completed">0</div></div>
              </div>
            </div>

            <div class="card rd-table-card">
              <div class="rd-tabs" role="tablist">
                <button type="button" class="rd-tab active" role="tab" aria-selected="true" data-tab="submitted"><i class="bi bi-file-earmark-text"></i> Submitted Research</button>
                <button type="button" class="rd-tab" role="tab" aria-selected="false" data-tab="completed"><i class="bi bi-check2-all"></i> Completed Research</button>
                <a class="btn btn-primary btn-sm rd-new" href="submit.html"><i class="bi bi-plus-lg"></i> New Submission</a>
              </div>
              <div style="overflow-x:auto;">
                <table class="rd-table">
                  <thead><tr><th>Title</th><th>Date Submitted</th><th>Status</th><th>Actions</th></tr></thead>
                  <tbody id="rows"></tbody>
                </table>
              </div>
              <div class="rd-empty" id="empty" style="display:none;"></div>
              <div class="rd-foot">
                <span id="showing"></span>
                <span class="rd-pages" id="pages"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      'use strict';

      // The researcher's dashboard: their profile, how much they have submitted
      // and completed, and every one of their research records (both the
      // classic form and the Research Submission form — the server merges
      // them). The server decides whose records these are; this page only
      // renders the answer and never asks for another user's submission.

      const PAGE_SIZE = 10;
      const COMPLETED = new Set(['approved', 'published', 'archived']);
      const STATUS_LABELS = {
        draft: 'Draft',
        submitted: 'Submitted',
        under_initial_checking: 'Under Initial Checking',
        for_revision: 'For Revision',
        under_ethics_review: 'Under Ethics Review',
        approved: 'Approved',
        published: 'Published',
        archived: 'Archived',
        rejected: 'Rejected'
      };
      const STATUS_TONE = {
        submitted: 'review', under_initial_checking: 'review', under_ethics_review: 'review',
        for_revision: 'revision',
        approved: 'done', published: 'done', archived: 'done',
        rejected: 'rejected',
        draft: 'muted'
      };
      const TYPE_LABELS = {
        student_thesis: 'Student Thesis', capstone: 'Capstone', feasibility: 'Feasibility Study',
        action_research: 'Action Research', institutional_research: 'Institutional Research',
        faculty_research: 'Faculty Research', non_teaching_research: 'Non-Teaching Research'
      };
      const STAGE_LABELS = { initial: 'Initial paper', final: 'Final paper' };

      const el = (id) => document.getElementById(id);
      let records = [];
      let tab = 'submitted';
      let page = 1;

      // Database rows and a person's typing: escaped before any innerHTML.
      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[ch]);
      }

      function dateOf(value) {
        const d = new Date(value);
        return isNaN(d) ? '—' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function toLogin() {
        window.location.href = 'login.html?next=my-submissions.html';
      }

      async function getJson(url) {
        const res = await fetch(url);
        if (res.status === 401) { toLogin(); return null; }
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Request failed.');
        return body;
      }

      // The same page serves every researcher role, so the heading names the
      // one that is signed in.
      const DASHBOARD_TITLES = {
        student_researcher: 'Student Dashboard',
        faculty_researcher: 'Faculty Dashboard',
        non_teaching_researcher: 'Non-Teaching Researcher Dashboard'
      };

      function renderTitle(role) {
        const title = DASHBOARD_TITLES[role] || 'Researcher Dashboard';
        el('dash-title').textContent = title;
        document.title = title + ' | CPRI';
      }

      // ---- Profile card ----
      function renderProfile(p, me) {
        el('p-name').textContent = p.fullName || me.fullName || p.username || '—';
        el('p-role').textContent = p.roleLabel || me.roleLabel || p.role || '—';
        el('p-dept').textContent = p.program || p.department || '—';
        el('p-email').textContent = p.email || '—';
        el('p-contact').textContent = p.contactNumber || '—';
        el('p-interests').textContent = p.researchInterests || '—';
        const photo = p.photoUrl || p.profilePhoto;
        if (photo) {
          const img = document.createElement('img');
          img.alt = '';
          img.src = photo;
          img.onerror = () => { el('p-avatar').innerHTML = '<i class="bi bi-person"></i>'; };
          el('p-avatar').textContent = '';
          el('p-avatar').appendChild(img);
        }
      }

      // ---- Research table ----
      function describe(r) {
        // The short line under the title: the abstract when there is one,
        // otherwise what kind of paper it is.
        if (r.abstract) {
          const text = String(r.abstract).replace(/\s+/g, ' ').trim();
          return text.length > 110 ? text.slice(0, 107) + '…' : text;
        }
        return [TYPE_LABELS[r.research_type] || r.research_type, STAGE_LABELS[r.stage], r.program].filter(Boolean).join(' · ');
      }

      function rowHtml(r) {
        const tone = STATUS_TONE[r.status] || 'muted';
        const label = r.statusLabel || STATUS_LABELS[r.status] || r.status || '—';
        const href = r.detailUrl || ('research-submission-detail.html?id=' + encodeURIComponent(r.id));
        // The detail page is where a draft is handed in and a record sent back
        // for revision gets its new files.
        const followUp = r.isOwner && ['draft', 'submitted', 'for_revision'].includes(r.status) && r.source === 'module'
          ? `<a class="rd-sub-action" href="${esc(href)}">${r.status === 'draft' ? 'Finish and submit' : 'Edit / resubmit'}</a>`
          : '';
        return `<tr>
          <td><div class="rd-title">${esc(r.title || 'Untitled submission')}</div><div class="rd-desc">${esc(describe(r))}</div></td>
          <td style="white-space:nowrap;">${esc(dateOf(r.created_at))}</td>
          <td><span class="rd-status ${tone}">${esc(label)}</span></td>
          <td><a class="rd-view" href="${esc(href)}"><i class="bi bi-eye"></i> View Details</a>${followUp}</td>
        </tr>`;
      }

      function visibleRecords() {
        return tab === 'completed' ? records.filter(r => COMPLETED.has(r.status)) : records;
      }

      function render() {
        const list = visibleRecords();
        const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        page = Math.min(page, pages);
        const start = (page - 1) * PAGE_SIZE;
        const shown = list.slice(start, start + PAGE_SIZE);

        el('rows').innerHTML = shown.map(rowHtml).join('');
        el('empty').style.display = list.length ? 'none' : '';
        el('empty').textContent = tab === 'completed'
          ? 'No completed research yet. Approved and published papers appear here.'
          : 'No research submitted yet. Use New Submission to send your first paper.';
        el('showing').textContent = list.length
          ? `Showing ${start + 1}–${start + shown.length} of ${list.length} result${list.length === 1 ? '' : 's'}`
          : '';

        el('pages').innerHTML = pages > 1
          ? `<button type="button" class="btn btn-outline-dark btn-sm" data-page="${page - 1}" ${page === 1 ? 'disabled' : ''}>Previous</button>` +
            `<button type="button" class="btn btn-outline-dark btn-sm" data-page="${page + 1}" ${page === pages ? 'disabled' : ''}>Next</button>`
          : '';
      }

      el('pages').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-page]');
        if (!btn || btn.disabled) return;
        page = Number(btn.dataset.page);
        render();
      });

      document.querySelectorAll('.rd-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          tab = btn.dataset.tab;
          page = 1;
          document.querySelectorAll('.rd-tab').forEach(b => {
            const active = b === btn;
            b.classList.toggle('active', active);
            b.setAttribute('aria-selected', active ? 'true' : 'false');
          });
          render();
        });
      });

      (async function () {
        try {
          const meRes = await fetch('/api/auth/me');
          if (meRes.status === 401 || !meRes.ok) {
            el('not-logged').style.display = '';
            return;
          }
          const me = (await meRes.json()).user || {};
          renderTitle(me.role);

          const [profilePayload, listPayload] = await Promise.all([
            getJson('/api/auth/profile').catch(() => ({ profile: {} })),
            getJson('/api/research-submissions')
          ]);
          if (!listPayload) return; // redirected to login

          renderProfile((profilePayload && profilePayload.profile) || {}, me);

          // Someone else's unfinished draft is never theirs to see; their own
          // drafts are listed so they can be finished.
          records = (listPayload.submissions || []).filter(r => r.status !== 'draft' || r.isOwner);
          el('stat-submitted').textContent = records.filter(r => r.status !== 'draft').length;
          el('stat-completed').textContent = records.filter(r => COMPLETED.has(r.status)).length;

          el('dashboard').style.display = '';
          render();
        } catch (err) {
          el('message').className = 'form-message error';
          el('message').textContent = err.message || 'Could not load your dashboard.';
        }
      })();
    })();
  </script>
</body>
</html>
