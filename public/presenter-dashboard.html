<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Research Gala Submissions | CPRI</title>
  <link rel="icon" type="image/png" href="/images/cpri-logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/gala.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <style>
    .gala-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:18px; }
    .gala-stat { border:1px solid var(--cpri-border); border-radius:12px; padding:12px 14px; background:var(--cpri-card); }
    .gala-stat b { display:block; font-size:1.5rem; color:var(--cpri-secondary); }
    .gala-stat span { color:var(--cpri-muted); font-size:.8rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Research Gala Submissions</h1>
        <p>Track the status of your Research Gala entries.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message" role="alert"></div>

        <div id="loading" class="empty-state">Loading your submissions…</div>

        <div id="not-logged" class="empty-state" style="display:none;">
          Please <a href="login.html">log in</a> to view your submissions.
        </div>

        <div id="dashboard" style="display:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
            <h2 style="margin:0;">My entries</h2>
            <a class="btn btn-primary" href="gala-form.html?new=1"><i class="bi bi-plus-lg"></i> New submission</a>
          </div>

          <div class="gala-summary" id="summary" style="display:none;"></div>

          <div id="list"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/gala-ui.js"></script>
  <script>
    var esc = GalaUI.esc;
    var message = document.getElementById('message');
    var loading = document.getElementById('loading');
    var notLogged = document.getElementById('not-logged');
    var dashboard = document.getElementById('dashboard');
    var list = document.getElementById('list');
    var summary = document.getElementById('summary');

    function showMsg(type, text) {
      message.className = 'form-message ' + type;
      message.textContent = text || '';
    }

    function card(s) {
      var title = s.title || 'Untitled draft';
      var primary = '';
      if (s.status === 'draft') primary = '<a class="btn btn-primary" href="gala-form.html?id=' + encodeURIComponent(s.id) + '">Resume draft</a>';
      else if (s.status === 'for_revision') primary = '<a class="btn btn-primary" href="gala-form.html?id=' + encodeURIComponent(s.id) + '">Revise and resubmit</a>';
      else if (s.editable) primary = '<a class="btn btn-soft" href="gala-form.html?id=' + encodeURIComponent(s.id) + '">Edit</a>';
      return '<article class="gala-item" data-id="' + esc(s.id) + '">' +
        '<div class="gala-item-head"><div><h3>' + esc(title) + '</h3>' +
        '<div class="gala-meta">' + (s.refNo ? esc(s.refNo) + ' &middot; ' : '') + esc(s.presentationTypeLabel || 'Format not chosen') +
        ' &middot; ' + (s.submittedAt ? 'submitted ' + esc(GalaUI.fmtDate(s.submittedAt)) : 'last saved ' + esc(GalaUI.fmtDate(s.updatedAt))) +
        ' &middot; ' + s.docsAttached + ' of ' + s.docsRequired + ' documents</div></div>' +
        GalaUI.pill(s.status, s.statusLabel) + '</div>' +
        (s.status === 'draft' ? '' : GalaUI.tracker(s) + GalaUI.scheduleBlock(s)) +
        GalaUI.notes(s) +
        '<div class="gala-actions">' + primary +
        '<a class="btn btn-navy" href="gala-submission.html?id=' + encodeURIComponent(s.id) + '">Details</a>' +
        (s.withdrawable ? '<button type="button" class="btn btn-soft" data-action="withdraw">' + (s.status === 'draft' ? 'Delete draft' : 'Withdraw') + '</button>' : '') +
        '</div></article>';
    }

    async function load() {
      loading.style.display = 'block';
      list.innerHTML = '';
      showMsg('', '');
      try {
        var res = await fetch('/api/gala', { credentials: 'include' });
        if (res.status === 401) {
          loading.style.display = 'none';
          notLogged.style.display = 'block';
          return;
        }
        var out = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(out.error || 'Could not load your submissions.');
        var items = out.submissions || [];
        loading.style.display = 'none';
        dashboard.style.display = 'block';

        if (!items.length) {
          summary.style.display = 'none';
          list.innerHTML = '<div class="empty-state">You have no Research Gala submissions yet.<br>' +
            '<a class="btn btn-primary" style="margin-top:12px;" href="gala-form.html">Start your first submission</a></div>';
          return;
        }

        var count = function (status) { return items.filter(function (s) { return s.status === status; }).length; };
        summary.style.display = 'grid';
        summary.innerHTML = [
          ['Total', items.length],
          ['Drafts', count('draft')],
          ['Submitted', count('submitted')],
          ['Under checking', count('under_checking')],
          ['Scheduled', count('scheduled')]
        ].map(function (p) { return '<div class="gala-stat"><b>' + p[1] + '</b><span>' + p[0] + '</span></div>'; }).join('');

        list.innerHTML = items.map(card).join('');
      } catch (err) {
        loading.style.display = 'none';
        showMsg('error', err.message);
      }
    }

    list.addEventListener('click', async function (e) {
      var btn = e.target.closest('[data-action="withdraw"]');
      if (!btn) return;
      var item = btn.closest('.gala-item');
      if (!item) return;
      if (!confirm('Remove this submission? This cannot be undone.')) return;
      btn.disabled = true;
      try {
        var res = await fetch('/api/gala/' + encodeURIComponent(item.dataset.id), { method: 'DELETE', credentials: 'include' });
        var out = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(out.error || 'Could not remove the submission.');
        showMsg('success', out.message || 'Submission removed.');
        load();
      } catch (err) {
        showMsg('error', err.message);
        btn.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
