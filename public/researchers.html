<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Researchers | CPRI</title>
  <link rel="icon" type="image/png" href="/images/cpri-logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Researchers</h1>
        <p>Faculty and student researcher profiles with research productivity summaries.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message"></div>

        <!-- Productivity Summary Dashboard -->
        <div id="dashboard" class="grid grid-3" style="margin-bottom:28px;"></div>

        <!-- Admin: Add researcher -->
        <div id="admin-panel" class="card" style="display:none;margin-bottom:22px;background:var(--cpri-bg-2);">
          <h3>CPRI Staff / Admin</h3>
          <p class="form-note">Register a new researcher profile.</p>
          <a class="btn btn-primary" href="researcher-form.html" style="display:inline-block;margin-top:8px;">+ Add Researcher</a>
        </div>

        <!-- Search & filter -->
        <div class="card" style="margin-bottom:22px;">
          <form id="filter-form">
            <div class="grid grid-3" style="gap:14px;">
              <div class="form-group" style="margin:0;">
                <label for="f-name">Name</label>
                <input type="text" id="f-name" name="fullName" placeholder="Researcher name">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-dept">Department / Program</label>
                <input type="text" id="f-dept" name="department" placeholder="Department or program">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="f-type">Type</label>
                <select id="f-type" name="type">
                  <option value="">All</option>
                  <option value="faculty">Faculty</option>
                  <option value="student">Student</option>
                  <option value="presenter">Presenter</option>
                </select>
              </div>
            </div>
            <div style="margin-top:14px;display:flex;gap:10px;">
              <button type="submit" class="btn btn-primary">Search</button>
              <button type="button" class="btn btn-navy" id="clear-btn">Clear</button>
            </div>
          </form>
        </div>

        <p class="form-note" id="records-summary" style="margin-bottom:10px;"></p>
        <div id="records" class="grid grid-3" style="gap:18px;"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const message = document.getElementById('message');
    const dashboard = document.getElementById('dashboard');
    const recordsEl = document.getElementById('records');
    const summaryEl = document.getElementById('records-summary');

    const TYPE_LABELS = { faculty: 'Faculty Researcher', student: 'Student Researcher', presenter: 'Presenter' };
    const SHORT_TYPE = { faculty: 'Faculty', student: 'Student', presenter: 'Presenter' };

    // Every card is a live database count from GET /api/researchers/stats.
    const STAT_CARDS = [
      { key: 'totalResearchers', label: 'Total Researchers' },
      { key: 'faculty', label: 'Faculty' },
      { key: 'students', label: 'Students' },
      { key: 'totalSubmissions', label: 'Total Submissions' },
      { key: 'ongoing', label: 'Ongoing' },
      { key: 'approved', label: 'Approved' },
      { key: 'published', label: 'Published' },
      { key: 'ethicsClearances', label: 'Ethics Clearances' },
      { key: 'galaPresentations', label: 'Gala Presentations' }
    ];

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function showMsg(type, text) {
      message.className = 'form-message ' + type;
      message.textContent = text;
    }

    function clearMsg() {
      message.className = 'form-message';
      message.textContent = '';
    }

    function buildQuery() {
      const fd = new FormData(document.getElementById('filter-form'));
      const p = new URLSearchParams();
      for (const [k, v] of fd.entries()) if (v) p.set(k, v);
      return p.toString();
    }

    function card(value, label) {
      return `<div class="card" style="text-align:center;padding:22px;">
        <div style="font-size:2rem;font-weight:800;color:var(--cpri-accent);">${escapeHtml(value)}</div>
        <div class="form-note" style="margin-top:4px;">${escapeHtml(label)}</div>
      </div>`;
    }

    function renderStats(stats) {
      dashboard.innerHTML = STAT_CARDS.map(c => card(Number(stats[c.key] || 0), c.label)).join('');
    }

    async function loadStats() {
      dashboard.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;padding:22px;">
        <div class="form-note" style="margin:0;">Loading researcher statistics…</div>
      </div>`;

      try {
        const res = await fetch('/api/researchers/stats');
        if (!res.ok) throw new Error('Stats request failed with status ' + res.status);
        const data = await res.json();
        if (!data || !data.stats) throw new Error('Stats response did not include a "stats" object.');
        renderStats(data.stats);
      } catch (err) {
        console.error('[researchers] Could not load statistics:', err);
        dashboard.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;padding:22px;">
          <div class="form-note" style="margin:0 0 10px;">Could not load researcher statistics.</div>
          <button type="button" class="btn btn-navy" id="retry-stats">Retry</button>
        </div>`;
        const retry = document.getElementById('retry-stats');
        if (retry) retry.addEventListener('click', loadStats);
      }
    }

    function countsLine(r) {
      if (r.source === 'profile') {
        return `Pubs: ${Number(r.publications || 0)} · Pres: ${Number(r.presentations || 0)} · Awards: ${Number(r.awards || 0)}`;
      }
      const subs = Number(r.submissions || 0);
      return `${subs} submission${subs === 1 ? '' : 's'} · ${Number(r.published || 0)} published`;
    }

    // A registered account is badged with who they are; a hand-entered profile
    // is badged with its documented output status.
    function badgeFor(r) {
      if (r.source === 'profile') return r.outputStatusLabel || 'Profile entry';
      if (r.role === 'non_teaching_researcher') return 'Non-Teaching';
      return SHORT_TYPE[r.type] || 'Researcher';
    }

    function researcherCard(r) {
      // A student's course (from the shared course list) leads; otherwise the
      // department/program the profile already showed.
      const place = r.course || r.department || r.program || r.researchArea || '—';
      const typeLabel = TYPE_LABELS[r.type] || r.roleLabel || r.type || 'Researcher';
      return `<div class="card" style="margin:0;display:flex;flex-direction:column;justify-content:space-between;">
        <div>
          <h3 style="margin:0 0 6px;"><a href="researcher-detail.html?id=${encodeURIComponent(r.id)}">${escapeHtml(r.fullName || 'Unnamed researcher')}</a></h3>
          <div class="meta">${escapeHtml(typeLabel)} · ${escapeHtml(place)}</div>
          ${r.researchTitle ? `<div class="meta" style="margin-top:6px;">Research: ${escapeHtml(r.researchTitle)}</div>` : ''}
          <div style="margin-top:10px;">
            <span class="badge">${escapeHtml(badgeFor(r))}</span>
            <span class="form-note">${escapeHtml(countsLine(r))}</span>
          </div>
        </div>
        <p style="margin:14px 0 0;"><a href="researcher-detail.html?id=${encodeURIComponent(r.id)}">View profile &rarr;</a></p>
      </div>`;
    }

    async function load() {
      const query = buildQuery();
      summaryEl.textContent = '';
      recordsEl.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">Loading researchers…</p>`;

      try {
        const res = await fetch('/api/researchers/directory' + (query ? '?' + query : ''));
        if (!res.ok) throw new Error('Directory request failed with status ' + res.status);
        const data = await res.json();
        const list = Array.isArray(data.researchers) ? data.researchers : [];

        if (!list.length) {
          recordsEl.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">${query
            ? 'No researchers match your search.'
            : 'No researchers yet.'}</p>`;
          if (!query) {
            summaryEl.textContent = 'Faculty, student and presenter accounts appear here once they are registered and approved.';
          }
          return;
        }

        recordsEl.innerHTML = list.map(researcherCard).join('');
        summaryEl.textContent = `Showing ${list.length} researcher${list.length === 1 ? '' : 's'}.`;
        clearMsg();
      } catch (err) {
        console.error('[researchers] Could not load the researcher list:', err);
        recordsEl.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;">
          <p class="form-note" style="margin:0 0 10px;">Could not load researchers. Please try again.</p>
          <button type="button" class="btn btn-navy" id="retry-list">Retry</button>
        </div>`;
        const retry = document.getElementById('retry-list');
        if (retry) retry.addEventListener('click', load);
      }
    }

    document.getElementById('filter-form').addEventListener('submit', (e) => { e.preventDefault(); load(); });
    document.getElementById('clear-btn').addEventListener('click', () => {
      document.getElementById('filter-form').reset();
      load();
    });

    (async () => {
      await loadStats();
      await load();
      try {
        const meRes = await fetch('/api/auth/me');
        if (meRes.ok) {
          const { user } = await meRes.json();
          if (['admin', 'cpri_staff'].includes(user.role)) {
            document.getElementById('admin-panel').style.display = 'block';
          }
        }
      } catch (err) {
        console.error('[researchers] Could not resolve the signed-in user:', err);
      }
    })();
  </script>
</body>
</html>
