<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | CPRI</title>
  <meta name="description" content="Private direct messages between CPRI staff, faculty, advisers, and ethics reviewers.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container-xl">
        <h1>Direct Messages</h1>
        <p>Private conversations with registered CPRI users — staff, faculty, advisers, reviewers, students, and visitors.</p>
      </div>
    </section>

    <section class="section">
      <div class="container-xl">
        <div class="form-message" id="msg"></div>

        <!-- Access-denied state: students / public visitors -->
        <div id="access-denied" class="empty-state" style="display:none;">
          <i class="bi bi-chat-square-text" style="font-size:2rem;display:block;margin-bottom:10px;color:var(--cpri-muted);"></i>
          Direct messaging is available to registered users only. Please <a href="login.html">log in</a> to use it.
        </div>

        <!-- Main two-pane layout -->
        <div id="dm-app" style="display:none;">
          <div class="admin-shell">
            <!-- Inbox pane -->
            <aside class="admin-side" style="overflow:hidden;">
              <div style="padding:16px;border-bottom:1px solid var(--cpri-border);display:flex;align-items:center;justify-content:space-between;gap:8px;">
                <b style="font-family:var(--font-head);display:flex;align-items:center;gap:8px;"><i class="bi bi-chat-left-text" style="color:var(--cpri-secondary);"></i> Inbox</b>
                <button type="button" class="btn btn-primary btn-sm" id="new-msg-btn" style="padding:6px 12px;font-size:.82rem;"><i class="bi bi-pencil-square"></i> New</button>
              </div>
              <div id="inbox" style="max-height:560px;overflow-y:auto;"></div>
            </aside>

            <!-- Thread pane -->
            <div class="admin-main" style="border-radius:var(--radius);overflow:hidden;">
              <div class="admin-toolbar" style="border-bottom:1px solid var(--cpri-border);">
                <div>
                  <h2 id="thread-name" style="font-size:1.05rem;">Select a conversation</h2>
                  <small id="thread-sub" style="color:var(--cpri-muted);"></small>
                </div>
                <div class="admin-toolbar-actions" id="thread-actions" style="display:none;">
                  <button type="button" class="btn btn-soft btn-sm" id="mark-read-btn"><i class="bi bi-check2-all"></i> Mark read</button>
                </div>
              </div>
              <div id="thread" class="dm-thread" style="max-height:440px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;"></div>
              <form id="composer" style="padding:14px;border-top:1px solid var(--cpri-border);display:flex;gap:10px;">
                <input type="text" id="dm-body" placeholder="Write a message…" maxlength="2000" aria-label="Message" style="flex:1;">
                <button type="submit" class="btn btn-primary" id="send-btn" disabled><i class="bi bi-send"></i> Send</button>
              </form>
            </div>
          </div>

          <!-- New message modal (contact picker) -->
          <div class="confirm-overlay" id="newModal" hidden>
            <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="newModalTitle" style="max-width:520px;">
              <div class="confirm-icon" style="background:var(--grad-brand);"><i class="bi bi-pencil-square"></i></div>
              <h3 id="newModalTitle">New Message</h3>
              <div class="form-group" style="margin-top:14px;">
                <label for="dm-to">To</label>
                <select id="dm-to" style="margin-bottom:10px;"></select>
              </div>
              <div class="form-group">
                <label for="dm-new-body">Message</label>
                <textarea id="dm-new-body" rows="4" maxlength="2000" placeholder="Write your message…"></textarea>
              </div>
              <div class="confirm-actions" style="margin-top:16px;">
                <button type="button" class="btn btn-navy" id="newCancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="newSend">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const MESSAGE_ROLES = ['admin', 'cpri_staff', 'faculty_researcher', 'adviser', 'ethics_reviewer', 'student_researcher', 'public_visitor'];

    const el = (id) => document.getElementById(id);

    function showMsg(type, text) {
      const m = el('msg');
      m.className = 'form-message ' + type;
      m.textContent = text;
    }

    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtTime(d) {
      const date = new Date(d);
      if (isNaN(date.getTime())) return '';
      const sameDay = date.toDateString() === new Date().toDateString();
      return sameDay
        ? date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
        : date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    const state = { contacts: [], currentId: null, inboxTimer: null };

    // ---- Inbox ----
    async function loadInbox(selectId) {
      try {
        const res = await fetch('/api/messages', { credentials: 'include' });
        if (!res.ok) return;
        const data = await res.json();
        const box = el('inbox');
        if (!data.conversations.length) {
          box.innerHTML = '<p class="form-note" style="padding:20px;text-align:center;">No conversations yet. Click <b>New</b> to start one.</p>';
          return;
        }
        box.innerHTML = data.conversations.map(c => `
          <button type="button" class="dm-convo${c.otherId === state.currentId ? ' active' : ''}" data-id="${c.otherId}" style="width:100%;text-align:left;padding:14px 16px;border:none;border-bottom:1px solid var(--cpri-border);cursor:pointer;display:flex;gap:12px;align-items:center;">
            <span class="cpri-avatar" style="width:38px;height:38px;font-size:.85rem;flex-shrink:0;">${escapeHtml((c.otherName || '?').slice(0, 2).toUpperCase())}</span>
            <span style="flex:1;min-width:0;">
              <b style="font-size:.92rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(c.otherName)}</b>
              <small style="color:var(--cpri-muted);font-size:.8rem;">${escapeHtml(c.otherRoleLabel)}${c.lastSenderIsMe ? ' · You: ' : ' · '}${escapeHtml((c.lastMessage || '').slice(0, 48))}</small>
            </span>
            ${c.unread ? `<span class="dot" style="display:grid;place-items:center;background:#e76f51;color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:.72rem;padding:0 5px;">${c.unread}</span>` : '<small style="color:var(--cpri-muted);font-size:.72rem;white-space:nowrap;">' + fmtTime(c.lastAt) + '</small>'}
          </button>`).join('');
        box.querySelectorAll('.dm-convo').forEach(btn => btn.addEventListener('click', () => openThread(btn.dataset.id)));
        if (selectId && data.conversations.some(c => c.otherId === selectId)) openThread(selectId);
      } catch { /* keep last state */ }
    }

    // ---- Thread ----
    async function openThread(userId) {
      state.currentId = userId;
      // Re-render keeps the active highlight in sync (loadInbox reads state.currentId).
      loadInbox();
      el('thread-actions').style.display = '';
      const res = await fetch('/api/messages/' + userId, { credentials: 'include' });
      if (!res.ok) { el('thread-name').textContent = 'Unavailable'; el('thread-sub').textContent = ''; return; }
      const data = await res.json();
      el('thread-name').textContent = data.other.fullName || data.other.username;
      el('thread-sub').textContent = (data.other.roleLabel || '') + (data.other.department ? ' · ' + data.other.department : '');
      const thread = el('thread');
      thread.innerHTML = data.messages.length
        ? data.messages.map(m => `
            <div class="dm-bubble ${m.mine ? 'mine' : 'theirs'}" style="max-width:75%;align-self:${m.mine ? 'flex-end' : 'flex-start'};background:${m.mine ? 'var(--grad-brand)' : 'var(--cpri-bg-2)'};color:${m.mine ? '#fff' : 'var(--cpri-text)'};padding:10px 14px;border-radius:16px;font-size:.92rem;line-height:1.45;">
              ${escapeHtml(m.body)}
              <small style="display:block;margin-top:4px;opacity:.75;font-size:.7rem;">${fmtTime(m.createdAt)}</small>
            </div>`).join('')
        : '<p class="form-note" style="text-align:center;margin:auto;">No messages yet — say hello!</p>';
      thread.scrollTop = thread.scrollHeight;
      el('send-btn').disabled = false;
      el('composer').dataset.userId = userId;
      // Mark thread as read (open thread = read).
      try { await fetch('/api/messages/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId }), credentials: 'include' }); } catch { /* best effort */ }
      loadInbox();
    }

    // ---- Contacts for the New Message modal ----
    async function loadContacts() {
      const res = await fetch('/api/messages/contacts', { credentials: 'include' });
      if (!res.ok) return;
      const data = await res.json();
      state.contacts = data.contacts || [];
      const sel = el('dm-to');
      sel.innerHTML = state.contacts.length
        ? state.contacts.map(c => `<option value="${c.id}">${escapeHtml(c.fullName)} — ${escapeHtml(c.roleLabel)}${c.department ? ' (' + escapeHtml(c.department) + ')' : ''}</option>`).join('')
        : '<option value="">No other staff members available</option>';
    }

    // ---- Composer (thread) ----
    el('composer').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = el('composer').dataset.userId;
      const body = el('dm-body').value.trim();
      if (!userId || !body) return;
      const res = await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipientId: userId, body }),
        credentials: 'include'
      });
      const out = await res.json();
      if (!res.ok) return showMsg('error', out.error);
      el('dm-body').value = '';
      openThread(userId);
    });

    // ---- New message modal ----
    el('new-msg-btn').addEventListener('click', () => { loadContacts(); el('newModal').hidden = false; });
    el('newCancel').addEventListener('click', () => { el('newModal').hidden = true; });
    el('newModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) el('newModal').hidden = true; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !el('newModal').hidden) el('newModal').hidden = true; });

    el('newSend').addEventListener('click', async () => {
      const recipientId = el('dm-to').value;
      const body = el('dm-new-body').value.trim();
      if (!recipientId) return showMsg('error', 'Please choose a recipient.');
      if (!body) return showMsg('error', 'Please write a message.');
      const res = await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipientId, body }),
        credentials: 'include'
      });
      const out = await res.json();
      if (!res.ok) return showMsg('error', out.error);
      el('newModal').hidden = true;
      el('dm-new-body').value = '';
      openThread(recipientId);
    });

    el('mark-read-btn').addEventListener('click', async () => {
      if (!state.currentId) return;
      try { await fetch('/api/messages/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: state.currentId }), credentials: 'include' }); } catch { /* best effort */ }
      loadInbox();
    });

    (async () => {
      // Who is logged in?
      let me = null;
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) me = (await res.json()).user;
      } catch { /* guest */ }
      if (!me || !MESSAGE_ROLES.includes(me.role)) {
        el('access-denied').style.display = 'block';
        return;
      }
      el('dm-app').style.display = '';
      loadInbox();
      // Light auto-refresh while the page is open.
      state.inboxTimer = setInterval(() => { if (!document.hidden) loadInbox(); }, 30000);
    })();
  </script>
</body>
</html>
