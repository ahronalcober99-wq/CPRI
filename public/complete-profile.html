<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile | CPRI Account</title>
  <link rel="icon" type="image/png" href="/images/cpri-logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Complete your profile</h1>
        <p>You signed in with Google for the first time — tell us how you'll use CPRI.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:560px;">
        <div class="form-message" id="message"></div>
        <form id="setup-form" class="card">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" disabled>
            <p class="form-note" style="margin-top:6px;">This is the Google account you signed in with.</p>
          </div>
          <div class="form-group">
            <label>Account Type *</label>
            <div class="role-pick" id="role-pick">
              <label class="rp-item">
                <input type="radio" name="role" value="student_researcher" checked>
                <span class="rp-body"><b>Student Researcher</b><small>Submitting capstone and research outputs.</small></span>
              </label>
              <label class="rp-item">
                <input type="radio" name="role" value="faculty_researcher">
                <span class="rp-body"><b>Faculty Researcher</b><small>Conducting and submitting research.</small></span>
              </label>
              <label class="rp-item">
                <input type="radio" name="role" value="adviser">
                <span class="rp-body"><b>Adviser</b><small>Advising and guiding researchers.</small></span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="department">Department (optional)</label>
            <input type="text" id="department" name="department">
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;">Save &amp; Continue</button>
          <p class="form-note" style="margin-top:12px;">You can change your role later by asking an administrator.</p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const message = document.getElementById('message');
    const form = document.getElementById('setup-form');
    const btn = document.getElementById('submit-btn');

    (async () => {
      try {
        const { res, data } = await CPRI.apiFetch('/api/auth/me', { credentials: 'include' });
        const user = data && data.user;
        if (!res.ok || !user) { window.location.href = 'login.html'; return; }
        if (!user.needsSetup) { window.location.href = 'account.html'; return; }
        if (user.fullName) document.getElementById('fullName').value = user.fullName;
        document.getElementById('email').value = user.email || '';
      } catch (err) {
        message.className = 'form-message error';
        message.textContent = err.message;
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = form.querySelector('input[name="role"]:checked');
      if (!role) {
        message.className = 'form-message error';
        message.textContent = 'Choose an account type.';
        return;
      }
      const data = Object.fromEntries(new FormData(form).entries());
      data.role = role.value;
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const { res, data: out } = await CPRI.apiFetch('/api/auth/profile/setup', {
          method: 'PUT', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error((out && out.error) || 'Save failed');
        window.location.href = 'account.html';
      } catch (err) {
        message.className = 'form-message error';
        message.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Save & Continue';
      }
    });
  </script>
</body>
</html>
