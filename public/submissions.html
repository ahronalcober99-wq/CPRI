<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Submissions | CPRI</title>
  <link rel="icon" type="image/png" href="/images/cpri-logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Research Submissions</h1>
        <p>Track the status of submitted research.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-message" id="message"></div>
        <div id="not-logged" class="empty-state" style="display:none;">
          Please <a href="login.html">log in</a> to view submissions.
        </div>

        <div id="list-area" style="display:none;">
          <div id="reviewer-banner" class="card" style="display:none;margin-bottom:20px;background:var(--cpri-bg-2);">
            You are viewing <strong>all submissions</strong> (reviewer/admin view). Use the controls to update status.
          </div>
          <div style="margin-bottom:18px;">
            <a class="btn btn-primary" href="submit.html">+ New Submission</a>
          </div>
          <div id="submissions"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const message = document.getElementById('message');
    const listArea = document.getElementById('list-area');
    const notLogged = document.getElementById('not-logged');
    const submissionsEl = document.getElementById('submissions');
    let isReviewer = false;
    let isAdmin = false;

    const STATUS_LABELS = {
      draft: 'Draft', submitted: 'Submitted', under_initial_checking: 'Under Initial Checking',
      for_revision: 'For Revision', under_ethics_review: 'Under Ethics Review',
      approved: 'Approved', published: 'Published', archived: 'Archived', rejected: 'Rejected'
    };
    const STATUS_ORDER = ['submitted','under_initial_checking','for_revision','under_ethics_review','approved','published','archived','rejected'];
    const RESEARCH_TYPE_LABELS = {
      institutional: 'Institutional Research', institutional_research: 'Institutional Research',
      faculty: 'Faculty Research', faculty_research: 'Faculty Research',
      non_teaching_research: 'Non-Teaching Research', student_thesis: 'Student Thesis',
      capstone: 'Capstone', feasibility: 'Feasibility Study', action_research: 'Action Research'
    };

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Submissions arrive through two forms that keep them in two tables:
    //   * the classic form       -> /api/submissions
    //   * Research Submission    -> /api/research-submissions (for staff/admin
    //     this list already includes the classic records, merged by id)
    // Both are read and merged here, one card per submission. Each card keeps
    // which store it lives in, because the two have different status rules.
    async function loadSubmissions() {
      const [classicRes, moduleRes] = await Promise.all([
        fetch('/api/submissions'),
        fetch('/api/research-submissions')
      ]);
      if (!classicRes.ok) return null;
      const classic = (await classicRes.json()).submissions || [];
      // A role without access to the Research Submission module (e.g. an
      // ethics reviewer) gets 403 there; the classic list still shows.
      const modules = moduleRes.ok ? ((await moduleRes.json()).submissions || []) : [];

      const byId = new Map();
      for (const r of modules) {
        // Someone else's unfinished draft is not a submission yet.
        if (r.status === 'draft' && !r.isOwner) continue;
        // A migrated record lives in both stores and the server shows the copy
        // updated last. Status changes must go to THAT copy, with its rules —
        // a classic copy carries no module nextStatuses, which used to leave
        // a record like a Published classic paper with no dropdown at all.
        const inModule = r.source === 'module';
        byId.set(r.id, {
          id: r.id,
          title: r.title,
          authors: r.authors,
          program: r.program,
          researchType: r.research_type,
          status: r.status,
          statusLabel: r.statusLabel || STATUS_LABELS[r.status] || r.status,
          createdAt: r.created_at,
          detailUrl: r.detailUrl || ('submission.html?id=' + encodeURIComponent(r.id)),
          kind: inModule ? 'module' : 'classic',
          stage: inModule ? r.stage : null,
          nextStatuses: r.nextStatuses || [],
          canDecideEthics: Boolean(r.canDecideEthics)
        });
      }
      for (const s of classic) {
        if (byId.has(s.id)) continue;
        byId.set(s.id, {
          ...s,
          detailUrl: 'submission.html?id=' + encodeURIComponent(s.id),
          kind: 'classic',
          stage: null,
          nextStatuses: []
        });
      }
      const time = (v) => { const t = new Date(v).getTime(); return Number.isNaN(t) ? 0 : t; };
      return [...byId.values()].sort((a, b) => time(b.createdAt) - time(a.createdAt));
    }

    function formTag(s) {
      const text = s.kind === 'module'
        ? 'Research Submission · ' + (s.stage === 'final' ? 'Final' : 'Initial')
        : 'Classic form';
      return `<span class="form-note" style="font-size:.8rem;">${esc(text)}</span>`;
    }

    async function render() {
      const submissions = await loadSubmissions();
      if (!submissions) { notLogged.style.display = 'block'; return; }
      listArea.style.display = 'block';

      if (!submissions.length) {
        submissionsEl.innerHTML = '<p class="empty-state">No submissions found.</p>';
        return;
      }
      submissionsEl.innerHTML = submissions.map(s => `
        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-start;">
            <div>
              <h3 style="margin:0 0 6px;"><a href="${esc(s.detailUrl)}">${esc(s.title)}</a></h3>
              <div class="meta">${esc([s.authors, s.program, RESEARCH_TYPE_LABELS[s.researchType] || s.researchType].filter(Boolean).join(' · '))}</div>
              <div style="margin-top:8px;"><span class="badge">${esc(s.statusLabel)}</span> <span class="form-note">${esc(s.createdAt ? new Date(s.createdAt).toLocaleDateString() : '')}</span> · ${formTag(s)}</div>
            </div>
            ${isReviewer ? statusControl(s) : ''}
            ${isAdmin && s.kind === 'classic' ? deleteControl(s) : ''}
          </div>
        </div>`).join('');

      submissionsEl.querySelectorAll('select.status-select').forEach(sel => {
        sel.addEventListener('change', (e) => updateStatus(e.target.dataset.id, e.target.dataset.kind, e.target.value));
      });
      submissionsEl.querySelectorAll('button.delete-submission').forEach(btn => {
        btn.addEventListener('click', () => deleteSubmission(btn));
      });
    }

    (async () => {
      const meRes = await fetch('/api/auth/me');
      if (!meRes.ok) { notLogged.style.display = 'block'; return; }
      const { user } = await meRes.json();
      isReviewer = ['admin','cpri_staff','ethics_reviewer'].includes(user.role);
      isAdmin = user.role === 'admin' && user.status === 'active';
      if (isReviewer) document.getElementById('reviewer-banner').style.display = 'block';
      await render();
    })();

    // Classic records keep their free status list. A Research Submission
    // follows its stage's workflow, so it offers only the moves the server
    // will accept from where it is now (sent with the record).
    function statusControl(s) {
      if (s.kind === 'module' && s.canDecideEthics) {
        // The ethics reviewer approves or rejects on the paper's own page,
        // where the Ethics Clearance can be attached.
        return `<div style="min-width:220px;"><label class="form-note">Ethics review</label>
          <p style="margin:6px 0 0;"><a class="btn btn-primary btn-sm" href="${esc(s.detailUrl)}">Review &amp; decide</a></p></div>`;
      }
      if (s.kind === 'module') {
        if (!s.nextStatuses.length) {
          // Rejected and Archived end the workflow; anything else is waiting on
          // a step this account does not take (e.g. the ethics decision).
          const why = s.stage === 'initial' && s.status === 'under_ethics_review'
            ? 'Awaiting the ethics reviewer\'s decision.'
            : (['rejected', 'archived'].includes(s.status)
              ? 'Final status — no further changes.'
              : 'No status change available for your account.');
          return `<div style="min-width:220px;"><label class="form-note">Update status</label>
            <p class="form-note" style="margin:6px 0 0;">${esc(why)} <a href="${esc(s.detailUrl)}">Open</a></p></div>`;
        }
        const opts = [`<option value="" selected>${esc(s.statusLabel)} (current)</option>`]
          .concat(s.nextStatuses.map(n => `<option value="${esc(n.value)}">${esc(n.label)}</option>`)).join('');
        const hint = s.stage === 'initial' && s.status === 'under_ethics_review'
          ? '<p class="form-note" style="margin:6px 0 0;font-size:.8rem;">Approval is recorded by the ethics reviewer.</p>' : '';
        return `<div style="min-width:220px;">
          <label class="form-note">Update status</label>
          <select class="status-select" data-id="${esc(s.id)}" data-kind="module" style="margin-top:4px;">${opts}</select>${hint}
        </div>`;
      }
      const opts = STATUS_ORDER.map(st => `<option value="${st}" ${st === s.status ? 'selected' : ''}>${STATUS_LABELS[st]}</option>`).join('');
      return `<div style="min-width:220px;">
        <label class="form-note">Update status</label>
        <select class="status-select" data-id="${esc(s.id)}" data-kind="classic" style="margin-top:4px;">${opts}</select>
      </div>`;
    }

    function deleteControl(s) {
      return `<button type="button" class="btn btn-outline btn-sm delete-submission" data-id="${esc(s.id)}">
        <i class="bi bi-trash"></i> Delete submission
      </button>`;
    }

    async function deleteSubmission(button) {
      const ask = window.confirmDialog || ((text) => Promise.resolve(window.confirm(text)));
      if (!await ask('Delete this submission? This cannot be undone.', 'Delete')) return;

      button.disabled = true;
      try {
        const res = await fetch('/api/submissions/' + encodeURIComponent(button.dataset.id), { method: 'DELETE' });
        const out = await res.json();
        if (!res.ok) {
          button.disabled = false;
          message.className = 'form-message error';
          message.textContent = out.error || 'Delete failed';
          return;
        }

        button.closest('.card')?.remove();
        if (!submissionsEl.querySelector('.card')) {
          submissionsEl.innerHTML = '<p class="empty-state">No submissions found.</p>';
        }
        message.className = 'form-message success';
        message.textContent = 'Submission deleted.';
      } catch {
        button.disabled = false;
        message.className = 'form-message error';
        message.textContent = 'Could not delete the submission. Please try again.';
      }
    }

    async function updateStatus(id, kind, status) {
      if (!status) return;
      const url = (kind === 'module' ? '/api/research-submissions/' : '/api/submissions/') + encodeURIComponent(id) + '/status';
      const res = await fetch(url, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) {
        message.className = 'form-message error';
        message.textContent = out.error || 'Update failed';
        await render(); // put the dropdown back to the real status
        return;
      }
      message.className = 'form-message success';
      message.textContent = 'Status updated to "' + (STATUS_LABELS[status] || status) + '".';
      // The next allowed moves depend on the new status, so redraw.
      await render();
    }
  </script>
</body>
</html>
