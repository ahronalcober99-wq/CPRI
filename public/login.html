<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CPRI Account</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{if(localStorage.getItem('cpri-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Account Login</h1>
        <p>Sign in to access CPRI system features.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:480px;">
        <div class="form-message" id="message"></div>
        <form id="login-form" class="card">
          <div class="form-group">
            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" name="identifier" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pwd-field">
              <input type="password" id="password" name="password" required autocomplete="current-password">
              <button type="button" class="pwd-toggle" aria-label="Hold to show password" aria-pressed="false" title="Hold to see"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;">Log In</button>
          <div class="google-divider"><span>or continue with Google</span></div>
          <div class="google-split">
            <button type="button" class="google-btn" id="google-btn">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              Continue with Google
            </button>
            <button type="button" class="google-caret" id="google-caret" aria-label="More sign-in options" aria-expanded="false" aria-haspopup="menu"><i class="bi bi-chevron-down"></i></button>
            <div class="google-menu" id="google-menu" role="menu">
              <button type="button" class="gm-item" data-action="direct" role="menuitem"><i class="bi bi-google"></i><span>Continue with Google<small>One-click sign-in</small></span></button>
              <button type="button" class="gm-item" data-action="bridge" role="menuitem"><i class="bi bi-arrow-up-right-square"></i><span>Complete sign-in in your browser<small>One-time code in your default browser</small></span></button>
            </div>
          </div>
          <p class="form-note" style="margin-top:14px;">
            <a href="forgot.html">Forgot password?</a> ·
            <a href="register.html">Create an account</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
  <script>
    const API_BASE = location.protocol.startsWith('http') ? location.origin : 'http://localhost:3000';
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    const btn = document.getElementById('submit-btn');

    // Show a message when Google bounces the visitor back with an error.
    const g = new URLSearchParams(location.search).get('google');
    const GMESSAGES = {
      denied: 'Google sign-in was cancelled.',
      error: 'Google sign-in failed. Please try again.',
      disabled: 'Your account has been disabled.',
      pending: 'Your account is pending admin approval.'
    };
    if (g && GMESSAGES[g]) {
      message.className = 'form-message error';
      message.textContent = GMESSAGES[g];
    }

    // One-click Gmail sign-in — starts the server OAuth flow when configured,
    // otherwise explains what is missing instead of navigating to raw JSON.
    // In embedded app browsers (where Google blocks the consent screen) the
    // shared handler opens the system-browser bridge dialog instead.
    const googleBtn = document.getElementById('google-btn');
    googleBtn.addEventListener('click', async () => {
      try {
        const started = await CPRI.startGoogleLogin(googleBtn);
        if (!started) throw new Error('not configured');
      } catch {
        googleBtn.disabled = false;
        message.className = 'form-message error';
        message.textContent = 'Google sign-in is not configured on this server yet. Use your username/email and password instead.';
      }
    });

    // One split button: the main area goes direct to Google; the caret reveals
    // the one-time-code browser flow — both in a single visual element.
    const caret = document.getElementById('google-caret');
    const gmenu = document.getElementById('google-menu');
    if (caret && gmenu) {
      const closeMenu = () => {
        gmenu.classList.remove('open');
        caret.setAttribute('aria-expanded', 'false');
      };
      caret.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = gmenu.classList.toggle('open');
        caret.setAttribute('aria-expanded', String(open));
      });
      gmenu.querySelectorAll('.gm-item').forEach((item) => {
        item.addEventListener('click', () => {
          closeMenu();
          if (item.dataset.action === 'bridge') {
            CPRI.startBrowserSignIn().then((ok) => {
              if (!ok) {
                message.className = 'form-message error';
                message.textContent = 'Google sign-in is not configured on this server yet. Use your username/email and password instead.';
              }
            });
          } else {
            googleBtn.click();
          }
        });
      });
      document.addEventListener('click', (e) => { if (!e.target.closest('.google-split')) closeMenu(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.className = 'form-message';
      const data = Object.fromEntries(new FormData(form).entries());
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || 'Login failed');
        window.location.href = 'account.html';
      } catch (err) {
        message.className = 'form-message error';
        message.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
